    '<select onchange="UI.sel.exId=this.value;render()" style="max-width:220px">'+list.map(function(x){
      return '<option value="'+x.id+'"'+(x.id===e.id?' selected':'')+'>'+h(x.name)+'</option>'}).join('')+'</select></h3>'+
    '<div class="grid g4 keep2" style="margin-bottom:12px">'+kp.map(function(k){

    '<div class="legend" style="margin-bottom:10px"><span><i style="background:var(--green)"></i>≥85% 掌握好</span><span><i style="background:var(--orange)"></i>70-85% 要再练</span><span><i style="background:var(--red)"></i>&lt;70% 必须重讲</span></div>'+
    (kp.filter(function(k){return k.rate<70}).length?'<div class="alert red">'+icon('bell',18)+'<div class="grow"><b>必须重讲</b>：'+

      '<th class="num" style="width:64px">总分</th></tr></thead><tbody>'+
      ss.map(function(s){

/* ---------- 班级对比 ---------- */
function scCmp(){
  if(DB.classes.length<2)return '<div class="card"><div class="empty">只有一个班，没法对比。<br><span class="mini">带两个班以上时，这一页会自动按考试名称把两个班放一起比。</span></div></div>';
  var names={};
  DB.exams.forEach(function(e){if(!names[e.name])names[e.name]=[];names[e.name].push(e)});
  var keys=Object.keys(names).filter(function(k){return names[k].length>1});
  if(!keys.length)return '<div class="card"><div class="empty">两个班还没有<b>同名</b>的考试。<br><span class="mini">给不同班的同一场考试起一样的名字（例：第一单元测试），这里就能自动对比。</span></div></div>';
  return '<div class="card"><h3>'+icon('chart',18)+'班级对比<span class="grow"></span>'+
    '<button class="btn sm" onclick="printCmp()">'+icon('print',15)+'打印</button></h3>'+
    keys.map(function(k){
      var arr=sortBy(names[k],function(e){return className(e.classId)});
      var mx=Math.max.apply(null,arr.map(function(e){return examStat(e).avg}))||1;
      return '<div style="margin-bottom:16px"><h3 style="font-size:15px">'+h(k)+'</h3>'+
        '<div class="tbwrap"><table><thead><tr><th class="stick1" style="width:130px">班级</th><th class="num">参考</th><th class="num">平均分</th><th class="num">及格率</th><th class="num">优秀率</th><th class="num">最高</th><th class="num">最低</th><th style="min-width:150px">对比</th></tr></thead><tbody>'+
        arr.map(function(e){var st=examStat(e),best=st.avg>=mx;
          return '<tr><td class="stick1"><b>'+h(className(e.classId))+'</b>'+(best?' <span class="tag green">领先</span>':'')+'</td>'+
          '<td class="num">'+st.cnt+'</td><td class="num"><b>'+st.avg+'</b></td><td class="num">'+st.pass+'%</td><td class="num">'+st.good+'%</td>'+
          '<td class="num">'+st.max+'</td><td class="num">'+st.min+'</td>'+
          '<td><div class="bar"><i style="width:'+Math.round(st.avg/mx*100)+'%;background:'+(best?'var(--green)':'var(--pri)')+'"></i></div></td></tr>'}).join('')+
        '</tbody></table></div></div>';
    }).join('')+
    '<div class="mini">同名考试自动配对。想比就把两个班的考试起同一个名字。</div></div>';
}
function printCmp(){
  var names={};
  DB.exams.forEach(function(e){if(!names[e.name])names[e.name]=[];names[e.name].push(e)});
  var inner='';
  Object.keys(names).forEach(function(k){
    if(names[k].length<2)return;
    inner+='<h3>'+h(k)+'</h3>'+tableHTML(['班级','参考人数','平均分','及格率','优秀率','最高','最低'],
      names[k].map(function(e){var st=examStat(e);return [className(e.classId),st.cnt,st.avg,st.pass+'%',st.good+'%',st.max,st.min]}));
  });
  printHTML('班级成绩对比',inner);
}

function cmDoPick(){
  var av=cmAvail(),rest=av.filter(function(s){return CM.used.indexOf(s.id)<0});

    if(!av.length){toast('今天没有可点的人');return}
    CM.used=[];rest=av;toast('一轮点完了，重新开始','ok');
  }

function cmVote(){

/* ---- 7 座位点名 ---- */
function cmSeat(){
  var c=curClass();
  var st=DB.seats.filter(function(x){return x.classId===c.id})[0];
  if(!st)return '<div class="center"><div class="big" style="color:#8b95a5">还没有座位表</div><div class="mid">先到「班级 → 座位表」排一次，这里就能按座位点名了</div></div>';
  var d=today();
  return '<div class="row" style="justify-content:center;margin-bottom:12px">'+
    '<button class="cmbtn" onclick="cmSeatPick()">随机点一个座位（空格）</button>'+
    '<button class="cmbtn gray" onclick="CM.seatHit=null;cmRender()">取消高亮</button></div>'+
    (CM.seatHit?'<div class="big" style="margin-bottom:10px">'+h(snameById(CM.seatHit))+'</div>':'')+
    '<div class="seatgrid" style="grid-template-columns:repeat('+nb(st.cols,6)+',1fr);max-width:900px;margin:0 auto">'+
      seatCells(st,c,d)+
    '</div>'+
    '<div class="mid" style="margin-top:12px;font-size:17px">讲台在'+(st.podium==='back'?'后面':'前面')+'。缺勤/请假的自动变淡，不会被抽到</div>';
}
function seatCells(st,c,d){
  var cells='';
  for(var r=0;r<nb(st.rows,7);r++){for(var col=0;col<nb(st.cols,6);col++){
    var sid=st.map[r+'-'+col];
    if(!sid){cells+='<div class="seat" style="opacity:.25">·</div>';continue}
    var s=findStu(sid);if(!s){cells+='<div class="seat" style="opacity:.25">·</div>';continue}
    var a=attState(c.id,d,sid);
    cells+='<div class="seat has'+(CM.seatHit===sid?' hit':'')+'" style="'+(a==='a'||a==='v'?'opacity:.3':'')+'" onclick="CM.seatHit=\''+sid+'\';cmRender()">'+h(sname(s))+'</div>';
  }}
  return cells;
}
function cmSeatPick(){
  var c=curClass(),st=DB.seats.filter(function(x){return x.classId===c.id})[0];
  if(!st)return;
  var d=today();
  var ids=[];Object.keys(st.map).forEach(function(k){var sid=st.map[k];if(sid){var a=attState(c.id,d,sid);if(a==='p'||a==='l')ids.push(sid)}});
  if(!ids.length){toast('没有可点的座位');return}
  var i=0,iv=setInterval(function(){
    CM.seatHit=ids[Math.floor(Math.random()*ids.length)];
    cmRender();
    if(++i>=12)clearInterval(iv);
  },90);
}

/* ---- 键盘快捷键 ---- */
function cmKey(e){
  if(!CM.on)return;
  if(e.key==='Escape'){closeClassMode();return}
  var n=parseInt(e.key,10);
  if(n>=1&&n<=7){cmTool(CMTOOLS[n-1].k);return}
  if(e.key===' '||e.code==='Space'){
    if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    e.preventDefault();
    if(CM.tool==='pick')cmDoPick();
    else if(CM.tool==='draw')cmDoDraw();
    else if(CM.tool==='group')cmDoGroup();
    else if(CM.tool==='timer')cmRun();
    else if(CM.tool==='seat')cmSeatPick();
  }
}

function cmtFacts(sid){
  var s=findStu(sid),c=stuClass(sid);
  var p=pointsOf(sid),ar=attRate(sid),av=examAvg(sid);
  var tags={};DB.reviews.filter(function(r){return r.sid===sid}).forEach(function(r){tags[r.tag]=(tags[r.tag]||0)+1});
  var top=sortBy(Object.keys(tags).map(function(k){return {k:k,n:tags[k]}}),function(x){return x.n},true).slice(0,4);
  var hwn=DB.hw.filter(function(a){return a.classId===c.id&&hwStat(a,sid).s==='n'}).length;
  return '<div class="tbwrap"><table><tbody>'+
    '<tr><th style="width:104px">积分</th><td>'+p+' 分（班级第 '+(sortBy(studs(c),function(x){return pointsOf(x.id)},true).map(function(x){return x.id}).indexOf(sid)+1)+' 名）</td></tr>'+
    '<tr><th>出勤率</th><td>'+ar+'%</td></tr>'+
    '<tr><th>平均分</th><td>'+(av==null?'还没考试':av+' 分')+'</td></tr>'+
    '<tr><th>欠交作业</th><td>'+hwn+' 次</td></tr>'+
    '<tr><th>最常被表扬</th><td>'+(top.length?top.map(function(x){return h(x.k)+'×'+x.n}).join('、'):'还没有点评记录')+'</td></tr>'+
    '<tr><th>重点关注</th><td>'+(s.focus?h(s.focus):'—')+'</td></tr>'+
  '</tbody></table></div>';
}
function genCmt(sid){
  var s=findStu(sid),c=stuClass(sid);
  var p=pointsOf(sid),ar=attRate(sid),av=examAvg(sid);
  var tags={};DB.reviews.filter(function(r){return r.sid===sid&&nb(r.v)>0}).forEach(function(r){tags[r.tag]=(tags[r.tag]||0)+1});
  var top=sortBy(Object.keys(tags).map(function(k){return {k:k,n:tags[k]}}),function(x){return x.n},true).slice(0,2);
  var rank=sortBy(studs(c),function(x){return pointsOf(x.id)},true).map(function(x){return x.id}).indexOf(sid)+1;
  var hwn=DB.hw.filter(function(a){return a.classId===c.id&&hwStat(a,sid).s==='n'}).length;
  var t=sname(s)+'同学：\n';
  t+='这一学期，'+(top.length?'老师印象最深的是你'+top.map(function(x){return x.k}).join('、')+'——'+(top[0].n>=4?'这已经成了你的习惯，很难得。':'希望你把这份好状态保持下去。'):'你在班里安静努力，老师都看在眼里。');
  t+='\n';
  if(av!=null){
    t+=av>=85?'学习上你基础扎实，成绩一直很稳（平均'+av+'分），可以试着挑战难一点的题。':
       av>=70?'学习上你已经跟得上（平均'+av+'分），如果做题再细心一点，成绩还能往上走一截。':
       '学习上你还有不小的空间（平均'+av+'分），老师相信你不是不会，是练得还不够——我们一起把基础题先拿稳。';
    t+='\n';
  }
  if(ar<95)t+='出勤上，这学期缺课稍多，希望下学期能少落课，落下的内容记得补上。\n';
  if(hwn>=3)t+='作业还有 '+hwn+' 次没交，这一点必须改——作业是最容易拿到的进步。\n';
  else if(hwn===0)t+='作业每次都交，态度很端正，这份自觉会一直帮到你。\n';
  if(s.focus)t+='老师会继续多留意你（'+s.focus+'），有困难随时找我。\n';
  t+=(p>=60?'班级积分'+p+'分排在第'+rank+'名，为你高兴！':'')+'\n下学期，老师期待看到更好的你。';
  var box=$('#cmtBox');if(box)box.value=t;
  toast('生成好了，改成你自己的话更打动人','ok');
}

function tkTodo(){
  var over=sortBy(DB.todos.filter(function(t){return !t.done&&t.due&&t.due<today()}),function(t){return t.due});
  var tdy=sortBy(DB.todos.filter(function(t){return !t.done&&t.due===today()}),function(t){return nb(t.ord)});
  var soon=sortBy(DB.todos.filter(function(t){return !t.done&&t.due&&t.due>today()}),function(t){return t.due});
  var no=DB.todos.filter(function(t){return !t.done&&!t.due});
  var done=sortBy(DB.todos.filter(function(t){return t.done}),function(t){return t.doneAt||''},true).slice(0,12);
  function row(t){
    var late=t.due&&t.due<today()&&!t.done;
    return '<div class="row tight" style="padding:7px 0;border-bottom:1px solid var(--line2)">'+
      '<input type="checkbox"'+(t.done?' checked':'')+' onchange="toggleTodo(\''+t.id+'\')" style="width:20px;height:20px;min-height:20px;flex:0 0 auto">'+
      (t.urg?'<span class="cal-dot '+t.urg+'" title="紧急程度"></span>':'')+
      '<span class="grow'+(t.done?' strike':'')+'">'+h(t.text)+
        (t.rep?' <span class="tag purple">'+({day:'每天',week:'每周',month:'每月'}[t.rep]||t.rep)+'</span>':'')+
      '</span>'+
      (t.due?'<span class="tag '+(late?'red':t.due===today()?'orange':'')+'">'+(late?'已过期 '+fmtD(t.due):fmtD(t.due))+'</span>':'')+
      '<button class="btn sm" onclick="editTodo(\''+t.id+'\')">改</button>'+
      '<button class="btn sm danger" onclick="delTodo(\''+t.id+'\')">删</button></div>';
  }
  return '<div class="card"><h3>'+icon('list',18)+'待办<span class="grow"></span>'+
    '<button class="btn pri sm" onclick="editTodo()">'+icon('plus',15)+'加一条</button>'+
    '<button class="btn sm" onclick="printTodo()">'+icon('print',15)+'打印</button></h3>'+
    '<div class="row" style="margin-bottom:10px"><input id="qtodo" placeholder="快速加一条，敲回车（默认今天）" onkeydown="if(event.key===\'Enter\')quickTodo()" style="max-width:420px">'+
      '<button class="btn" onclick="quickTodo()">加</button></div>'+
    (over.length?'<div class="alert red">'+icon('bell',18)+'<div class="grow"><b>过期没做的 '+over.length+' 件</b>，先把这些清掉</div></div>'+over.map(row).join(''):'')+
    '<h3 style="font-size:15px;margin-top:12px">今天（'+tdy.length+'）</h3>'+(tdy.length?tdy.map(row).join(''):'<div class="mini">今天没有安排</div>')+
    (no.length?'<h3 style="font-size:15px;margin-top:12px">没定日期（'+no.length+'）</h3>'+no.map(row).join(''):'')+
    (soon.length?'<h3 style="font-size:15px;margin-top:12px">往后（'+soon.length+'）</h3>'+soon.map(row).join(''):'')+
    (done.length?'<h3 style="font-size:15px;margin-top:12px">最近做完的<span class="grow"></span><button class="btn sm" onclick="clearDone()">清掉已完成</button></h3>'+done.map(row).join(''):'')+
  '</div>';
}

var POMO={left:0,run:false,tm:null,mode:'work',done:0};
function tkPomo(){
  var m=Math.floor(POMO.left/60),s=POMO.left%60;
  return '<div class="card" style="text-align:center"><h3 style="justify-content:center">'+icon('clock',18)+'专注钟</h3>'+
    '<div style="font-size:min(20vw,120px);font-weight:800;line-height:1.1;letter-spacing:2px;color:'+(POMO.mode==='work'?'var(--pri)':'var(--green)')+'">'+pad(m)+':'+pad(s)+'</div>'+
    '<div class="mini" style="margin-bottom:12px">'+(POMO.mode==='work'?'专注中——批作业 / 写教案，别碰手机':'休息一下，站起来走两步')+'　今天已完成 '+POMO.done+' 个</div>'+
    '<div class="row" style="justify-content:center;flex-wrap:wrap">'+
      '<button class="btn pri lg" onclick="pomoRun()">'+(POMO.run?'暂停':'开始')+'</button>'+
      '<button class="btn lg" onclick="pomoSet(\'work\',25)">25 分钟专注</button>'+
      '<button class="btn lg" onclick="pomoSet(\'rest\',5)">5 分钟休息</button>'+
      '<button class="btn lg" onclick="pomoSet(\'work\',45)">45 分钟</button>'+
      '<button class="btn lg ghost" onclick="pomoSet(POMO.mode,0)">归零</button>'+
    '</div>'+
    '<div class="mini" style="margin-top:12px">时间到会响一声。切到别的页面计时不会停。</div>'+
  '</div>';
}
function pomoSet(mode,min){POMO.mode=mode;POMO.left=min*60;if(POMO.tm){clearInterval(POMO.tm);POMO.tm=null}POMO.run=false;render()}
function pomoRun(){
  if(POMO.run){clearInterval(POMO.tm);POMO.tm=null;POMO.run=false;render();return}
  if(POMO.left<=0)POMO.left=(POMO.mode==='work'?25:5)*60;
  POMO.run=true;
  POMO.tm=setInterval(function(){
    POMO.left--;
    if(POMO.left<=0){
      clearInterval(POMO.tm);POMO.tm=null;POMO.run=false;
      if(POMO.mode==='work'){POMO.done++;POMO.mode='rest';POMO.left=5*60}else{POMO.mode='work';POMO.left=25*60}
      cmBeep();toast(POMO.mode==='rest'?'专注结束，休息 5 分钟':'休息结束，继续干','ok');
    }
    if(UI.page==='task'&&curTab('task','todo')==='pomo')render();
  },1000);
  render();
}

        '<button class="btn sm'+((hb.days||[]).indexOf(today())>=0?' on':' pri')+'" onclick="tickHabit(\''+hb.id+'\',\''+today()+'\')">'+
          ((hb.days||[]).indexOf(today())>=0?'今天已打卡':'今天打卡')+'</button>'+
        '<button class="btn sm" onclick="editHabit(\''+hb.id+'\')">改</button>'+

          return '<i class="'+((hb.days||[]).indexOf(d)>=0?'on':'')+(d===today()?' today':'')+'" title="'+fmtDW(d)+'" onclick="tickHabit(\''+hb.id+'\',\''+d+'\')" style="cursor:pointer"></i>'}).join('')+

function habitStreak(hb){
  var n=0,d=today();
  if((hb.days||[]).indexOf(d)<0)d=addD(d,-1);
  while((hb.days||[]).indexOf(d)>=0){n++;d=addD(d,-1)}

}

  var hb=DB.habits.filter(function(x){return x.id===id})[0];if(!hb)return;

  if(i>=0)hb.days.splice(i,1);else hb.days.push(d);
  save();render();

function editArch(id){
  var x=id?DB.archives.filter(function(y){return y.id===id})[0]:null;
  formModal(x?'修改档案记录':'记一条档案',[
    {k:'type',label:'类型',type:'select',opts:ARTYPES,val:x?x.type:'公开课'},

      attKpi(y+' 年记录',inY.length,'')+
      attKpi('累计记录',DB.archives.length,'')+
      attKpi(y+' 年学时',ch+' / '+goal,ch<goal?'var(--orange)':'var(--green)')+
      attKpi('获奖累计',DB.archives.filter(function(x){return x.type==='获奖'}).length,'var(--orange)')+
    '</div>'+
    (ch<goal?'<div class="alert orange">'+icon('bell',18)+'<div class="grow"><b>继续教育还差 '+(goal-ch)+' 学时</b>（目标 '+goal+'）。参加完培训记得到「全部记录」里登记学时。'+

      return '<div class="vb" title="'+x.t+'：'+y+'年 '+x.n+' 条，累计 '+x.all+' 条"><u>'+(x.n||'')+'</u>'+
        '<i style="height:'+Math.round(x.n/mx*92)+'%;background:'+(x.n?'var(--pri)':'var(--line2)')+'"></i><s>'+x.t+'</s></div>'}).join('')+'</div>'+
  '</div>'+
  '<div class="card"><h3>'+icon('award',18)+'按级别（全部年份）</h3>'+
    '<div class="tbwrap"><table><thead><tr><th>级别</th><th class="num">数量</th><th>占比</th></tr></thead><tbody>'+
    lv.map(function(x){
      return '<tr><td>'+x.l+'</td><td class="num">'+x.n+'</td><td><div class="bar"><i style="width:'+pct(x.n,DB.archives.length)+'%"></i></div></td></tr>'}).join('')+
    '</tbody></table></div>'+
    '<div class="row" style="margin-top:10px"><button class="btn sm" onclick="copyArch()">'+icon('copy',15)+'复制成一段话（评职称材料用）</button></div>'+
  '</div>';
}
function copyArch(){

function exportJSON(){
  try{dl('班主任工作台_备份_'+today()+'.json',JSON.stringify(DB,null,1),'application/json');}catch(e){toast('导出失败','err')}
}
function importJSON(file){
  if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var obj=JSON.parse(rd.result);
      if(!obj||!obj.meta||!obj.classes)throw new Error('格式不对');
      ask('导入备份会<b>覆盖当前所有数据</b>。确定继续？<br><span class="mini">导入前已自动存一份快照，可在「恢复自动快照」退回。</span>',function(){
        try{localStorage.setItem(SNAP,JSON.stringify(DB))}catch(e){}
        DB=obj;migrate();save(true);render();toast('已从备份导入','ok');
      },{danger:true});
    }catch(e){toast('文件不是有效备份，导入失败','err')}
  };
  rd.readAsText(file);
}
function restoreSnap(){
  var raw=null;try{raw=localStorage.getItem(SNAP)}catch(e){}
  if(!raw){toast('还没有快照（程序每次打开会自动留一份）','err');return}
  ask('用上一次自动保存的快照<b>覆盖当前数据</b>？',function(){
    try{DB=JSON.parse(raw);migrate();save(true);render();toast('已从快照恢复','ok')}catch(e){toast('快照损坏，无法恢复','err')}
  },{danger:true});
}
function clearAll(){
  ask('这会<b>清空所有数据</b>（学生、成绩、考勤…全部），且无法撤销！<br><span class="mini">确定前请务必先「导出备份」。</span>',function(){
    ask('再确认一次：真的清空？',function(){
      try{localStorage.removeItem(KEY);localStorage.removeItem(SNAP)}catch(e){}
      DB=seed();migrate();save(true);render();toast('已清空，已恢复示例数据','ok');
    },{danger:true,title:'最后确认',ok:'清空全部'});
  },{danger:true,title:'危险操作',ok:'清空全部'});
}
function trashRestore(id){
  var t=(DB.trash||[]).filter(function(x){return x.id===id})[0];
  if(!t)return;
  var k=t.kind,d=t.data;
  if(k==='学生'){var c=classById(d.classId);if(c&&!c.students.some(function(s){return s.id===d.stu.id}))c.students.push(d.stu);toast('已还原学生','ok')}
  else if(k==='名册'){var c2=classById(d.classId);if(c2){d.students.forEach(function(s){if(!c2.students.some(function(x){return x.id===s.id}))c2.students.push(s)})}toast('已还原名册','ok')}
  else if(k==='班级'){if(!DB.classes.some(function(x){return x.id===d.id}))DB.classes.push(d);toast('已还原班级','ok')}
  else{var arr=TRASH_TARGET[k];if(!arr){toast('此类型暂不支持自动还原','err');return}
    if(!DB[arr].some(function(x){return x.id===d.id}))DB[arr].push(d);toast('已还原：'+k,'ok')}
  save();render();
}
function trashDelete(id){
  ask('彻底删除这条记录？此操作不可恢复。',function(){
    DB.trash=(DB.trash||[]).filter(function(x){return x.id!==id});save();render();toast('已彻底删除','ok');
  },{danger:true});
}
function trashClear(){
  ask('清空回收站？里面的内容都会被永久删除。',function(){
    DB.trash=[];save();render();toast('回收站已清空','ok');
  },{danger:true});
}

/* ========================= 1. 日程安排 RENDER.sched ========================= */
/* 数据结构：DB.schedules[] = {id, classId, title, date, time, type, dur, place, note, done} */
function schedTypeTag(t){
  var m={备课:'blue',教研:'purple',批改:'orange',辅导:'green',会议:'blue',其他:''};
  var c=m[t]||'';
  return '<span class="tag '+(c?c:'')+'">'+h(t)+'</span>';
}
RENDER.sched=function(){
  DB.schedules=DB.schedules||[];
  var c=curClass();if(!c)return '<div class="empty">请先创建一个班级</div>';
  var list=DB.schedules.filter(function(x){return x.classId===c.id});
  var ws=weekStart(), we=addD(ws,6), t=today();

  var weekN=list.filter(function(x){return x.date>=ws&&x.date<=we}).length;
  var doneN=list.filter(function(x){return x.done}).length;
  var pendN=list.length-doneN;
  var prepN=list.filter(function(x){return x.type==='备课'}).length;
  var corrN=list.filter(function(x){return x.type==='批改'||x.type==='辅导'}).length;

  var tab=curTab('sched','all');
  var items=[{k:'all',t:'全部'},{k:'备课',t:'备课'},{k:'教研',t:'教研'},{k:'批改',t:'批改'},
    {k:'辅导',t:'辅导'},{k:'会议',t:'会议'},{k:'其他',t:'其他'}];
  var show=tab==='all'?list.slice():list.filter(function(x){return x.type===tab});
  show.sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)});

  var out='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">'+
    '<h2 style="margin:0;font-size:calc(var(--fs)+4px)">日程安排</h2>'+
    '<span class="grow"></span>'+
    '<button class="btn" onclick="schedExport()">'+icon('down',15)+'导出</button>'+
    '<button class="btn" onclick="schedPrint()">'+icon('print',15)+'打印</button>'+
    '<button class="btn pri" onclick="schedAdd()">'+icon('plus',15)+'新增日程</button>'+
  '</div>';

  out+='<div class="sc-grid">'+
    statCard('blue',weekN,'本周日程数',ws.slice(5)+' ~ '+we.slice(5),'')+
    statCard(pendN?'orange':'green',pendN,'待完成','已完成 '+doneN+' 项','')+
    statCard('purple',prepN,'备课次数','','')+
    statCard('green',corrN,'批改 / 辅导次数','','')+
  '</div>';

  out+=tabBar('sched',items);

  if(!show.length){
    out+='<div class="empty">还没有'+(tab==='all'?'':'「'+tab+'」')+'日程，点右上角"新增日程"加一条</div>';
  } else {
    var byD={};
    show.forEach(function(x){(byD[x.date]=byD[x.date]||[]).push(x)});
    var ds=Object.keys(byD).sort();
    out+='<div class="timeline">';
    ds.forEach(function(d){
      out+='<div class="tl-group"><div class="tl-date">'+fmtD(d)+
        ' <span class="tl-dow">'+WD[dow(d)]+(d===t?' · 今天':'')+'</span></div>';
      byD[d].forEach(function(x){
        out+='<div class="tl-item" onclick="schedEdit(\''+x.id+'\')">'+
          '<div class="tl-time">'+h(x.time||'')+'</div>'+
          '<div class="tl-body"><div class="tl-title">'+h(x.title||'未命名')+
            (x.done?' <span class="tag green">已完成</span>':'')+'</div>'+
            '<div class="tl-sub">'+schedTypeTag(x.type)+
            (x.dur?(' · '+nb(x.dur)+' 分钟'):'')+
            (x.place?(' · '+h(x.place)):'')+
            (x.note?(' · '+h(x.note)):'')+'</div></div>'+
          '<div class="'+(x.done?'tl-done checked':'tl-done')+
            '" onclick="event.stopPropagation();schedToggle(\''+x.id+'\')">'+
            (x.done?icon('check',16):'')+'</div>'+
          '<button class="btn sm ghost" onclick="event.stopPropagation();schedDel(\''+x.id+'\')">'+icon('trash',14)+'</button>'+
        '</div>';
      });
      out+='</div>';
    });
    out+='</div>';
  }
  return out;
};
function schedAdd(){schedEdit(null)}
function schedEdit(id){
  DB.schedules=DB.schedules||[];
  var c=curClass();
  var x=id?DB.schedules.filter(function(y){return y.id===id})[0]:null;
  var types=['备课','教研','批改','辅导','会议','其他'];
  formModal(id?'编辑日程':'新增日程',[
    {k:'title',label:'标题',val:x?x.title:'',ph:'第3单元集体备课'},
    {k:'date',label:'日期',type:'date',val:x?x.date:today()},
    {k:'time',label:'时间',type:'time',val:x?x.time:'08:00'},
    {k:'type',label:'类型',type:'select',opts:types.map(function(t){return {v:t,t:t}}),val:x?x.type:'备课'},
    {k:'dur',label:'时长（分钟）',type:'number',val:x?nb(x.dur):45,min:0,step:5},
    {k:'place',label:'地点',val:x?x.place:'',ph:'办公室 / 教室'},
    {k:'note',label:'备注',val:x?x.note:'',full:true,ph:'带教案、课件'},
    {k:'done',label:'',type:'check',ph:'标记为已完成',val:x?!!x.done:false}
  ],function(v){
    if(!v.title){toast('请填写标题','err');return false}
    pushUndo('日程');
    if(x){x.title=v.title;x.date=v.date;x.time=v.time;x.type=v.type;x.dur=v.dur;x.place=v.place;x.note=v.note;x.done=v.done}
    else DB.schedules.push({id:uid(),classId:c.id,title:v.title,date:v.date,time:v.time,type:v.type,dur:v.dur,place:v.place,note:v.note,done:!!v.done});
    save();render();toast('已保存','ok');
  });
}
function schedToggle(id){
  var x=(DB.schedules||[]).filter(function(y){return y.id===id})[0];if(!x)return;
  x.done=!x.done;save();render();
}
function schedDel(id){
  var x=(DB.schedules||[]).filter(function(y){return y.id===id})[0];if(!x)return;
  ask('删除这条日程？',function(){
    pushUndo('删除日程');trashPut('日程',x.title,x);
    DB.schedules=DB.schedules.filter(function(y){return y.id!==id});save();render();toast('已删除','ok');
  },{danger:true});
}
function schedExport(){
  DB.schedules=DB.schedules||[];
  var c=curClass();
  var rows=[['日期','时间','标题','类型','时长(分)','地点','备注','是否完成']];
  DB.schedules.filter(function(x){return x.classId===c.id}).sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)}).forEach(function(x){
    rows.push([x.date,x.time||'',x.title||'',x.type||'',nb(x.dur),x.place||'',x.note||'',x.done?'是':'否']);
  });
  dlCSV(c.name+'_日程安排.csv',rows);toast('已导出','ok');
}
function schedPrint(){
  DB.schedules=DB.schedules||[];
  var c=curClass();
  var list=DB.schedules.filter(function(x){return x.classId===c.id}).sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)});
  var rows=list.map(function(x){return [x.date,x.time||'',x.title||'',x.type||'',(nb(x.dur)?nb(x.dur)+'分':''),x.place||'',x.done?'已完成':'未完成']});
  printHTML(c.name+' · 日程安排', tableHTML(['日期','时间','标题','类型','时长','地点','完成'],rows));
}

/* ========================= 2. 违纪统计 RENDER.disc ========================= */
/* 数据结构：DB.disciplines[] = {id, classId, sid, date, type(DISC_TYPES.k), reason, score, handled} */
RENDER.disc=function(){
  var c=curClass();if(!c)return '<div class="empty">请先创建一个班级</div>';
  var disc=(DB.disciplines||[]).filter(function(d){return d.classId===c.id});
  var ws=weekStart();
  var weekN=disc.filter(function(d){return d.date>=ws}).length;
  var pendN=disc.filter(function(d){return !d.handled}).length;
  var stus={};disc.forEach(function(d){if(d.sid)stus[d.sid]=1});
  var stuN=Object.keys(stus).length;
  var scoreSum=sum(disc.map(function(d){return nb(d.score)}));

  var tab=curTab('disc','all');
  var items=[{k:'all',t:'全部'}].concat(DISC_TYPES.map(function(t){return {k:t.k,t:t.t}}));
  var tabLabel=tab==='all'?'':((DISC_TYPES.filter(function(t){return t.k===tab})[0]||{}).t||'');
  var show=tab==='all'?disc.slice():disc.filter(function(d){return d.type===tab});
  show.sort(function(a,b){return b.date.localeCompare(a.date)});

  var max=1;
  var bars=DISC_TYPES.map(function(t){
    var n=disc.filter(function(d){return d.type===t.k}).length;
    if(n>max)max=n;
    return {t:t,n:n};
  });

  var out='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">'+
    '<h2 style="margin:0;font-size:calc(var(--fs)+4px)">违纪统计</h2>'+
    '<span class="grow"></span>'+
    '<button class="btn" onclick="discExport()">'+icon('down',15)+'导出</button>'+
    '<button class="btn" onclick="discPrint()">'+icon('print',15)+'打印</button>'+
    '<button class="btn pri" onclick="discAdd()">'+icon('plus',15)+'记违纪</button>'+
  '</div>';

  out+='<div class="sc-grid">'+
    statCard('blue',weekN,'本周违纪总数',ws.slice(5)+' 起','')+
    statCard(pendN?'red':'green',pendN,'待处理',pendN?'需跟进':'已清零','')+
    statCard('purple',stuN,'涉及学生','累计 '+disc.length+' 条','')+
    statCard('orange',scoreSum,'累计扣分','','')+
  '</div>';

  out+=tabBar('disc',items);

  out+='<div class="card"><h3>'+icon('chart',18)+'按类型分布<span class="grow"></span><span class="mini">共 '+disc.length+' 条</span></h3>'+
    bars.map(function(r){
      var w=r.n?Math.round(r.n/max*100):0;
      var col=w>=66?'pb-red':w>=33?'pb-orange':'pb-green';
      return '<div class="progbar"><div class="pb-lbl">'+h(r.t.t)+'</div>'+
        '<div class="pb-track"><div class="pb-fill '+col+'" style="width:'+w+'%"></div></div>'+
        '<div class="pb-pct">'+r.n+'</div></div>';
    }).join('')+
  '</div>';

  out+='<div style="margin-top:14px">';
  if(!show.length){
    out+='<div class="empty">还没有'+(tabLabel?('「'+tabLabel+'」'):'')+'违纪记录，点"记违纪"登记一条</div>';
  } else {
    show.forEach(function(d){
      var s=findStu(d.sid);
      var tt=(DISC_TYPES.filter(function(t){return t.k===d.type})[0]||{t:'其他'}).t;
      var col= d.type==='late'?'orange':(d.type==='fight'||d.type==='damage')?'red':'blue';
      out+='<div class="disc-item">'+
        avatHtml(s?sname(s):'?',38)+
        '<div class="di-info"><div class="di-name">'+h(s?sname(s):'（已删除学生）')+'</div>'+
          '<div class="di-reason"><span class="tag '+col+'">'+h(tt)+'</span> '+h(d.reason||'')+
          (d.handled?' <span class="tag green">已处理</span>':'')+'</div></div>'+
        '<div class="di-score">-'+nb(d.score)+'</div>'+
        '<div class="di-date">'+fmtD(d.date)+'</div>'+
        '<button class="btn sm" onclick="discEdit(\''+d.id+'\')">'+icon('edit',13)+'</button>'+
        '<button class="btn sm danger" onclick="discDel(\''+d.id+'\')">'+icon('trash',13)+'</button>'+
      '</div>';
    });
  }
  out+='</div>';
  return out;
};
function discAdd(){discEdit(null)}
function discEdit(id){
  var c=curClass();
  var x=id?DB.disciplines.filter(function(y){return y.id===id})[0]:null;
  var ss=studs(c);
  formModal(id?'编辑违纪':'记违纪',[
    {k:'sid',label:'学生',type:'select',opts:ss.map(function(s){return {v:s.id,t:s.no+' '+sname(s)}}),val:x?x.sid:(ss[0]||{}).id},
    {k:'type',label:'类型',type:'select',opts:DISC_TYPES.map(function(t){return {v:t.k,t:t.t}}),val:x?x.type:'late'},
    {k:'reason',label:'原因 / 详情',val:x?x.reason:'',full:true,ph:'上课讲话，提醒后改正'},
    {k:'score',label:'扣分数',type:'number',val:x?nb(x.score):1,min:0,step:1},
    {k:'date',label:'日期',type:'date',val:x?x.date:today()},
    {k:'handled',label:'',type:'check',ph:'已处理（谈话 / 通知家长）',val:x?!!x.handled:false}
  ],function(v){
    if(!v.sid){toast('请选择学生','err');return false}
    pushUndo('违纪记录');
    if(x){x.sid=v.sid;x.type=v.type;x.reason=v.reason;x.score=v.score;x.date=v.date;x.handled=v.handled}
    else DB.disciplines.push({id:uid(),classId:c.id,sid:v.sid,date:v.date,type:v.type,reason:v.reason,score:nb(v.score),handled:!!v.handled});
    save();render();toast('已记录','ok');
  });
}
function discDel(id){
  var x=DB.disciplines.filter(function(y){return y.id===id})[0];if(!x)return;
  ask('删除这条违纪记录？',function(){
    pushUndo('删除违纪');trashPut('违纪记录',snameById(x.sid)+' '+x.date,x);
    DB.disciplines=DB.disciplines.filter(function(y){return y.id!==id});save();render();toast('已删除','ok');
  },{danger:true});
}
function discExport(){
  var c=curClass();
  var rows=[['学生','类型','原因','扣分','日期','是否处理']];
  DB.disciplines.filter(function(d){return d.classId===c.id}).forEach(function(d){
    var tt=(DISC_TYPES.filter(function(t){return t.k===d.type})[0]||{t:'其他'}).t;
    rows.push([snameById(d.sid),tt,d.reason||'',nb(d.score),d.date,d.handled?'是':'否']);
  });
  dlCSV(c.name+'_违纪记录.csv',rows);toast('已导出','ok');
}
function discPrint(){
  var c=curClass();
  var rows=DB.disciplines.filter(function(d){return d.classId===c.id}).sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(d){
    var tt=(DISC_TYPES.filter(function(t){return t.k===d.type})[0]||{t:'其他'}).t;
    return [snameById(d.sid),tt,d.reason||'',('-'+nb(d.score)),d.date,d.handled?'已处理':'未处理'];
  });
  printHTML(c.name+' · 违纪统计', tableHTML(['学生','类型','原因','扣分','日期','处理'],rows));
}

/* ========================= 3. 请假管理 RENDER.leave2 ========================= */
/* 复用并增强 DB.leaves[] = {id, classId, sid, type(中文), s, e, by, note} */
RENDER.leave2=function(){
  var c=curClass();if(!c)return '<div class="empty">请先创建一个班级</div>';

/* ---------- 饼图（SVG） ---------- */
function pieSVG(data){
  if(!data||!data.length)return '';
  var tot=sum(data.map(function(d){return d.n}));if(!tot)return '';
  var cx=90,cy=90,r=80,ang=-Math.PI/2,parts='';
  data.forEach(function(d){
    if(!d.n)return;
    var a2=ang+d.n/tot*Math.PI*2;
    var x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang);
    var x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    var large=(a2-ang)>Math.PI?1:0;
    parts+='<path d="M'+cx+' '+cy+' L'+r1(x1)+' '+r1(y1)+' A'+r+' '+r+' 0 '+large+' 1 '+r1(x2)+' '+r1(y2)+' Z" fill="'+d.color+'"/>';
    ang=a2;
  });
  return '<svg class="pie-svg" viewBox="0 0 180 180">'+parts+'</svg>';
}

var L_MONTHS=['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
function lLeapMonth(y){return LUNAR_INFO[y-1900]&0xf}
function lLeapDays(y){return lLeapMonth(y)?((LUNAR_INFO[y-1900]&0x10000)?30:29):0}
function lMonthDays(y,m){return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29}
function lYearDays(y){var s=348;for(var i=0x8000;i>0x8;i>>=1)s+=(LUNAR_INFO[y-1900]&i)?1:0;return s+lLeapDays(y)}
function lSeq(y){var l=lLeapMonth(y),a=[];for(var m=1;m<=12;m++){a.push({m:m,leap:false});if(m===l)a.push({m:m,leap:true})}return a}
function cnDayNum(n){
  var C=['一','二','三','四','五','六','七','八','九','十'];
  if(n<=10)return '初'+C[n-1];
  if(n<20)return '十'+(n===10?'':C[n-11]);
  if(n===20)return '二十';
  if(n<30)return '廿'+C[n-21];
  return '三十';
}
/* 公历 → 农历，返回 {y,m,d,leap,text:'八月十二'}，越界返回 null */
function solar2lunar(dstr){
  var p=String(dstr).split('-'),y=+p[0],m=+p[1],d=+p[2];
  if(y<1900||y>2100)return null;
  var off=Math.floor((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);
  if(off<0)return null;
  var ly;
  for(ly=1900;ly<=2100;ly++){
    var yd=lYearDays(ly);
    if(off<yd)break;
    off-=yd;
    if(ly===2100&&off>=0)return null;
  }
  if(ly>2100)return null;
  var seq=lSeq(ly),lm=1,ld=1,isLeap=false;
  for(var s=0;s<seq.length;s++){
    var md=seq[s].leap?lLeapDays(ly):lMonthDays(ly,seq[s].m);
    if(off<md){lm=seq[s].m;ld=off+1;isLeap=seq[s].leap;break}
    off-=md;
  }
  return {y:ly,m:lm,d:ld,leap:isLeap,
    text:(isLeap?'闰':'')+L_MONTHS[lm-1]+cnDayNum(ld)};
}
/* 农历 → 公历，返回 'YYYY-MM-DD'，非法返回 null */
function lunar2solar(ly,lm,ld,isLeap){
  if(ly<1900||ly>2100)return null;
  var leap=lLeapMonth(ly);
  if(isLeap&&leap!==lm)return null;
  if(ld<1||ld>30)return null;
  var seq=lSeq(ly),days=0,found=false;
  for(var s=0;s<seq.length;s++){
    var it=seq[s],md=it.leap?lLeapDays(ly):lMonthDays(ly,it.m);
    if(it.m===lm&&it.leap===!!isLeap){
      if(ld>md)return null;
      days+=ld-1;found=true;break;
    }
    days+=md;
  }
  if(!found)return null;
  var base=0;
  for(var i=1900;i<ly;i++){
    base+=lYearDays(i);
    if(i===2100)break;
  }
  var dt=new Date(Date.UTC(1900,0,31)+(base+days)*86400000);
  return dt.getUTCFullYear()+'-'+pad(dt.getUTCMonth()+1)+'-'+pad(dt.getUTCDate());
}

/* ---------- 二十四节气（Meeus 太阳黄经算法，北京时间，不受浏览时区影响） ---------- */
var TERM_NAMES=['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
function sunLon(jd){ /* 太阳视黄经 */
  var T=(jd-2451545)/36525,rad=Math.PI/180;
  var L0=280.46646+36000.76983*T+0.0003032*T*T;
  var M=357.52911+35999.05029*T-0.0001537*T*T;
  var C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M*rad)+(0.019993-0.000101*T)*Math.sin(2*M*rad)+0.000289*Math.sin(3*M*rad);
  var om=125.04-1934.136*T;
  var lon=L0+C-0.00569-0.00478*Math.sin(om*rad);
  return ((lon%360)+360)%360;
}
function termDateOf(y,n){ /* y 年第 n 个（0=小寒）节气日期 'YYYY-MM-DD' */
  if(y<1901||y>2098)return '';
  var target=((n*15)+285)%360; /* 小寒=285° */
  var jd=Date.UTC(y,Math.floor(n/2),1)/86400000+2440587.5; /* 该节气所在月 1 日 */
  var fwd=(((target-sunLon(jd))%360)+360)%360; /* 距目标黄经的顺行角度（0~360°） */
  jd+=fwd/0.98565; /* 一次到位的粗估 */
  for(var i=0;i<6;i++){ /* 小步精修 */
    var d2=((target-sunLon(jd))%360+540)%360-180; /* 此时只差不到 1° */
    jd+=d2/0.98565;
    if(Math.abs(d2)<0.0005)break;
  }
  var d=new Date((jd-2440587.5)*86400000+8*3600000); /* 转北京时间 */
  return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
}
var TERM_CACHE={};
function termOf(dstr){
  var y=+dstr.slice(0,4),m=+dstr.slice(5,7);
  if(!TERM_CACHE[y]){
    var t={};
    for(var k=0;k<24;k++){var d=termDateOf(y,k);if(d)t[d]=TERM_NAMES[k]}
    TERM_CACHE[y]=t;
  }
  return TERM_CACHE[y][dstr]||'';
}

/* ---------- 节日 / 纪念日 ---------- */
var FIXED_FEST={'02-14':'情人节','03-08':'妇女节','03-12':'植树节','04-01':'愚人节','05-04':'青年节','05-12':'护士节','06-01':'儿童节','07-01':'建党节','08-01':'建军节','11-08':'记者节','11-11':'光棍节','12-05':'国际志愿者日','12-24':'平安夜','12-25':'圣诞节'};
var FIXED_MEMO={'03-05':'学雷锋日','04-15':'国家安全教育日','06-26':'国际禁毒日','07-07':'七七事变','09-03':'抗战胜利纪念日','09-18':'九一八事变','09-30':'烈士纪念日','12-01':'世界艾滋病日','12-09':'一二九运动','12-13':'国家公祭日'};
function nthSunday(y,m,n){ /* 某月第 n 个星期日的日期数字 */
  var c=0;
  for(var d=1;d<=31;d++){
    var dt=new Date(Date.UTC(y,m-1,d));
    if(dt.getUTCMonth()!==m-1)break;
    if(dt.getUTCDay()===0){c++;if(c===n)return d}
  }
  return 0;
}
/* 法定节假日（红字） */
function legalFestOf(dstr){
  var md=dstr.slice(5);
  if(md==='01-01')return '元旦';
  if(md==='05-01')return '劳动节';
  if(md==='09-10')return '教师节';
  if(md==='10-01')return '国庆节';
  var L=solar2lunar(dstr);
  if(L){
    if(!L.leap&&L.m===1&&L.d===1)return '春节';
    if(!L.leap&&L.m===5&&L.d===5)return '端午节';
    if(!L.leap&&L.m===8&&L.d===15)return '中秋节';
  }
  if(termOf(dstr)==='清明')return '清明节';
  return '';
}
/* 农历传统节日（紫字） */
function lunarFestOf(dstr){
  var L=solar2lunar(dstr);if(!L||L.leap)return '';
  if(L.m===1&&L.d===15)return '元宵节';
  if(L.m===7&&L.d===7)return '七夕节';
  if(L.m===9&&L.d===9)return '重阳节';
  if(L.m===12&&L.d===8)return '腊八节';
  var N=solar2lunar(addD(dstr,1));
  if(N&&!N.leap&&N.m===1&&N.d===1)return '除夕';
  return '';
}
/* 综合当天节日：cat 1法定 2农历 3公历 4纪念日（同日只显示一个） */
function dayFest(dstr){
  var f=legalFestOf(dstr);if(f)return {name:f,cat:1};
  f=lunarFestOf(dstr);if(f)return {name:f,cat:2};
  var y=+dstr.slice(0,4),m=+dstr.slice(5,7),md=dstr.slice(5);
  if(m===5){
    var d2=nthSunday(y,5,2);
    if(d2&&md==='05-'+pad(d2))return {name:'母亲节',cat:3};
    var d3=nthSunday(y,5,3);
    if(d3&&md==='05-'+pad(d3))return {name:'全国助残日',cat:4};
  }
  if(m===6){
    var d6=nthSunday(y,6,3);
    if(d6&&md==='06-'+pad(d6))return {name:'父亲节',cat:3};
  }
  if(FIXED_FEST[md])return {name:FIXED_FEST[md],cat:3};
  if(FIXED_MEMO[md])return {name:FIXED_MEMO[md],cat:4};
  return null;
}
/* 当天格子全部信息 */
function calDayInfo(dstr){
  var term=termOf(dstr);
  return {
    lunar:solar2lunar(dstr),
    term:term,
    fest:dayFest(dstr),
    cust:(DB.customHols||[]).filter(function(x){return x.date===dstr}),
    todos:(DB.todos||[]).filter(function(t){return t.due===dstr&&!t.done})
  };
}

/* ---------- 法定节假日（倒计时列表用，含图标） ---------- */
var LEGAL_LIST=[
  {name:'元旦',ico:'🎉',md:'01-01'},
  {name:'春节',ico:'🧧',lunar:[1,1]},
  {name:'清明节',ico:'🌿',term:'清明'},
  {name:'劳动节',ico:'🛠️',md:'05-01'},
  {name:'端午节',ico:'🚣',lunar:[5,5]},
  {name:'教师节',ico:'🍎',md:'09-10'},
  {name:'国庆节',ico:'🎆',md:'10-01'},
  {name:'中秋节',ico:'🥮',lunar:[8,15]}
];
function nextDateOf(item){
  var t=today(),y0=+t.slice(0,4);
  for(var y=y0;y<=y0+1;y++){
    var d='';
    if(item.md)d=y+'-'+item.md;
    else if(item.lunar)d=lunar2solar(y,item.lunar[0],item.lunar[1],false);
    else if(item.term){
      var idx=TERM_NAMES.indexOf(item.term);
      if(idx>=0)d=termDateOf(y,idx);
    }
    if(d&&d>=t)return d;
  }
  return '';
}
/* 最近一个假日（法定 + 自定义） */
function nextHoliday(){
  var t=today(),best=null;
  for(var i=0;i<=730;i++){
    var d=addD(t,i),f=dayFest(d);
    if(f&&f.cat===1){best={d:d,name:f.name,ico:'🎉',days:i};break}
  }
  (DB.customHols||[]).forEach(function(x){
    if(x.date&&x.date>=t){
      var dd=diffD(t,x.date);
      if(!best||dd<best.days)best={d:x.date,name:x.name,ico:x.icon||'📅',days:dd};
    }
  });
  return best;
}
/* 寒暑假状态 */
function vacState(){
  var v=DB.meta.vac||{},t=today(),list=[];
  if(v.summer&&v.summer.s)list.push({name:'暑假',s:v.summer.s,e:v.summer.e||v.summer.s});
  if(v.winter&&v.winter.s)list.push({name:'寒假',s:v.winter.s,e:v.winter.e||v.winter.s});
  if(!list.length)return {st:'none'};
  for(var i=0;i<list.length;i++){
    var x=list[i];
    if(t>=x.s&&t<=x.e)return {st:'on',name:x.name,e:x.e,days:diffD(t,x.e)+1};
  }
  var up=list.filter(function(x){return x.s>t}).sort(function(a,b){return a.s<b.s?-1:1});
  if(up.length)return {st:'pre',name:up[0].name,s:up[0].s,days:diffD(t,up[0].s)};
  return {st:'end'};
}

/* ==================================================================
   p18.js —— 云同步模块（前端）
   两种后端：
   - mode 'github'：用你自己 GitHub 私人仓库的 API 存密文，免费、不用绑卡、最隐私
   - mode 'server'：自建服务（Render 等），POST 到 /sync?code=
   通用：数据先在「本机」用同步码派生密钥做 AES-GCM 加密，再上传；
        服务器/仓库只存密文，看不到任何明文。
   依赖：crypto.subtle（浏览器原生）、fetch、localStorage、KEY/DB/save/render/toast
   ================================================================== */

var SYNC_SALT = 'wb_desk_sync_salt_v1';
var SYNCING = false;          // 拉取进行中，避免触发回写
var syncPushT = null;         // 防抖上传计时器
var syncIntT = null;          // 自动轮询计时器

/* ---------- 基础工具 ---------- */
function syncEnsure() { if (!DB.sync) DB.sync = {}; if (!DB.sync.mode) DB.sync.mode = 'github'; return DB.sync; }
function syncPersist() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }
function syncBase() { return (DB.sync && DB.sync.base && DB.sync.base.trim()) || ''; }
function syncCodeHex(code) { return sha256hex('wb_desk_sync:' + code); }
function syncMode() { return (DB.sync && DB.sync.mode) || 'github'; }

function sha256hex(str) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  });
}
function syncB64(buf) {
  var b = new Uint8Array(buf), s = '';
  for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s);
}
function syncUnB64(s) {
  var bin = atob(s), b = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return b.buffer;
}
function syncB64Utf8(str) {
  var bytes = new TextEncoder().encode(str), bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function syncUnB64Utf8(b64) {
  var bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ---------- 加解密（AES-GCM，密钥由同步码 PBKDF2 派生） ---------- */
function syncImportKey(code) {
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']).then(function (base) {
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: enc.encode(SYNC_SALT), iterations: 100000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  });
}
function syncEncrypt(code) {
  return syncImportKey(code).then(function (key) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var plain = new TextEncoder().encode(JSON.stringify(DB));
    return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, plain).then(function (ct) {
      return syncB64(iv) + '.' + syncB64(ct);
    });
  });
}
function syncDecrypt(code, payload) {
  var parts = (payload || '').split('.');
  if (parts.length !== 2) throw new Error('数据格式不对');
  return syncImportKey(code).then(function (key) {
    var iv = new Uint8Array(syncUnB64(parts[0]));
    var ct = syncUnB64(parts[1]);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct).then(function (pt) {
      return JSON.parse(new TextDecoder().decode(pt));
    });
  });
}

/* ---------- GitHub 仓库模式（免卡） ---------- */
function syncGHCfg() {
  var s = syncEnsure();
  /* 自动迁移旧路径（%2F 坑）到新扁平路径 */
  if (s.ghPath && (s.ghPath === '.wb_sync/sync.json' || s.ghPath.indexOf('.wb_sync/') >= 0)) {
    s.ghPath = 'wbsync_data.json'; syncPersist();
  }
  return {
    owner: (s.ghOwner || '').trim(),
    repo: (s.ghRepo || '').trim(),
    branch: (s.ghBranch || 'main').trim() || 'main',
    path: (s.ghPath || '').trim() || 'wbsync_data.json',
    token: (s.ghToken || '').trim()
  };
}
function syncGHApi(path, opts) {
  opts = opts || {};
  var h = { 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'wb-desk-sync' };
  var t = syncGHCfg().token;
  if (t) h['Authorization'] = 'Bearer ' + t;
  var f = { headers: h };
  if (opts.method) f.method = opts.method;
  if (opts.body) f.body = opts.body;
  return fetch('https://api.github.com' + path, f);
}
async function syncPushGH() {
  var s = syncEnsure();
  var c = syncGHCfg();
  if (!c.owner || !c.repo || !c.token) { toast('先填写 GitHub 仓库名和访问令牌', 'err'); return; }
  try {
    var p = '/repos/' + c.owner + '/' + c.repo + '/contents/' + encodeURIComponent(c.path) + '?ref=' + encodeURIComponent(c.branch);
    /* 推送前先取云端：若云端编辑时间更新，先合并下来，绝不覆盖别人刚改的数据（最后批改为准） */
    var g = await syncGHApi(p, { method: 'GET' });
    var j = null, sha = null, cloudV = 0, cloudData = null;
    if (g.ok) {
      j = await g.json(); sha = j.sha;
      try { var o = JSON.parse(syncUnB64Utf8(j.content)); if (o && o.data) { cloudV = o.v || 0; cloudData = o.data; } } catch (e) {}
    }
    if (cloudV > DB.meta.updated && cloudData) {
      try {
        var dbc = await syncDecrypt(s.code, cloudData);
        SYNCING = true; DB = dbc; migrate();
        s.lastV = cloudV; s.lastT = Date.now(); syncPersist(); SYNCING = false; render();
        toast('已合并云端更新的数据', 'ok'); return;
      } catch (e) { /* 解密失败则用本地上传覆盖 */ }
    }
    /* 本地较新或云端为空：推送本地（版本号 = 最后编辑时间） */
    var payload = await syncEncrypt(s.code);
    var v = DB.meta.updated;
    var content = syncB64Utf8(JSON.stringify({ v: v, data: payload }));
    var putBody = JSON.stringify({ message: 'wb-desk sync', content: content, branch: c.branch });
    if (sha) putBody = JSON.stringify({ message: 'wb-desk sync', content: content, branch: c.branch, sha: sha });
    var r = await syncGHApi(p, { method: 'PUT', body: putBody });
    if (!r.ok) { var t = await r.text(); throw new Error('HTTP ' + r.status + (t ? '：' + t.slice(0, 120) : '')); }
    s.lastV = v; s.lastT = Date.now(); s.lastPushT = Date.now(); syncPersist();
    toast('已同步到 GitHub 仓库', 'ok');
  } catch (e) { toast('上传失败：' + (e && e.message ? e.message : e), 'err'); }
}
async function syncPullGH() {
  var s = syncEnsure();
  var c = syncGHCfg();
  if (!c.owner || !c.repo || !c.token) { toast('先填写 GitHub 仓库名和访问令牌', 'err'); return; }
  try {
    var p = '/repos/' + c.owner + '/' + c.repo + '/contents/' + encodeURIComponent(c.path) + '?ref=' + encodeURIComponent(c.branch);
    var r = await syncGHApi(p, { method: 'GET' });
    if (r.status === 404) {
      /* 兼容旧版本：试一下旧路径 .wb_sync/sync.json */
      var pOld = '/repos/' + c.owner + '/' + c.repo + '/contents/.wb_sync%2Fsync.json?ref=' + encodeURIComponent(c.branch);
      try { var rOld = await syncGHApi(pOld, { method: 'GET' }); if (rOld.ok) r = rOld; } catch (e) {}
    }
    if (r.status === 404) { toast('云端还没有数据，先在电脑上点一次「立即上传」', 'err'); return; }
    if (!r.ok) { var t = await r.text(); throw new Error('HTTP ' + r.status + (t ? '：' + t.slice(0, 120) : '')); }
    var j = await r.json();
    var obj = JSON.parse(syncUnB64Utf8(j.content));
    if (!obj || !obj.data) throw new Error('空数据');
    /* 用「我已知云端版本 s.lastV」比较，而非本地编辑时间，避免本地保存动作污染判断 */
    if (s.lastV && obj.v <= s.lastV) { toast('云端无更新', 'ok'); return; }
    var db = await syncDecrypt(s.code, obj.data);
    SYNCING = true; DB = db; migrate();
    s.lastV = obj.v; s.lastT = Date.now(); s.lastPullT = Date.now(); syncPersist(); SYNCING = false; render();
    toast('已从云端拉取最新数据', 'ok');
  } catch (e) { toast('拉取失败：' + (e && e.message ? e.message : e), 'err'); }
}

/* ---------- 自建服务模式（Render 等） ---------- */
async function syncPushServer() {
  var s = syncEnsure();
  if (!syncBase()) { toast('先填写同步服务地址', 'err'); return; }
  try {
    s._hex = await syncCodeHex(s.code);
    var url = syncBase().replace(/\/+$/, '') + '/sync?code=' + s._hex;
    /* 推送前先取云端：若云端编辑时间更新，先合并下来，不覆盖 */
    var g = await fetch(url, { method: 'GET' });
    var cloudV = 0, cloudData = null;
    if (g.ok) { var o = await g.json(); if (o && o.data) { cloudV = o.v || 0; cloudData = o.data; } }
    if (cloudV > DB.meta.updated && cloudData) {
      try {
        var dbc = await syncDecrypt(s.code, cloudData);
        SYNCING = true; DB = dbc; migrate();
        s.lastV = cloudV; s.lastT = Date.now(); syncPersist(); SYNCING = false; render();
        toast('已合并云端更新的数据', 'ok'); return;
      } catch (e) {}
    }
    var payload = await syncEncrypt(s.code);
    var v = DB.meta.updated;
    var r = await fetch(url, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ v: v, data: payload })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    s.lastV = v; s.lastT = Date.now(); s.lastPushT = Date.now(); syncPersist();
    toast('已同步到云端', 'ok');
  } catch (e) { toast('上传失败：' + (e && e.message ? e.message : e), 'err'); }
}
async function syncPullServer() {
  var s = syncEnsure();
  if (!syncBase()) { toast('先填写同步服务地址', 'err'); return; }
  try {
    s._hex = await syncCodeHex(s.code);
    var r = await fetch(syncBase().replace(/\/+$/, '') + '/sync?code=' + s._hex, { method: 'GET' });
    if (r.status === 404) { toast('云端还没有数据，先在电脑上点一次「立即上传」', 'err'); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var obj = await r.json();
    if (!obj || !obj.data) throw new Error('空数据');
    if (s.lastV && obj.v <= s.lastV) { toast('云端无更新', 'ok'); return; }
    var db = await syncDecrypt(s.code, obj.data);
    SYNCING = true; DB = db; migrate();
    s.lastV = obj.v; s.lastT = Date.now(); s.lastPullT = Date.now(); syncPersist(); SYNCING = false;
    render();
    toast('已从云端拉取最新数据', 'ok');
  } catch (e) { toast('拉取失败：' + (e && e.message ? e.message : e), 'err'); }
}

/* ---------- 统一入口（按 mode 分发） ---------- */
async function syncPush() {
  var s = syncEnsure();
  if (!s.code) { toast('先填写同步码', 'err'); return; }
  if (syncMode() === 'github') return syncPushGH();
  return syncPushServer();
}
async function syncPull() {
  var s = syncEnsure();
  if (!s.code) { toast('先填写同步码', 'err'); return; }
  if (syncMode() === 'github') return syncPullGH();
  return syncPullServer();
}

/* ---------- 自动同步 ---------- */
function syncReady() {
  var s = DB.sync; if (!s || !s.auto) return false;
  if (syncMode() === 'github') return !!(s.code && s.ghOwner && s.ghRepo && s.ghToken);
  return !!(s.code && syncBase());
}
function syncSchedulePush() {
  if (!syncReady() || SYNCING) return;
  clearTimeout(syncPushT);
  syncPushT = setTimeout(function () { syncPush(); }, 4000);
}
function syncStartAuto() {
  var s = DB.sync;
  if (!s || !s.auto || syncIntT) return;
  syncIntT = setInterval(function () {
    if (syncReady() && !SYNCING) syncPull();
  }, 20000);
}

/* ---------- 设置页调用 ---------- */
function syncSaveCfg() {
  var s = syncEnsure();
  s.mode = ($('#syncMode').value || 'github');
  s.code = ($('#syncCode').value || '').trim();
  if (s.mode === 'github') {
    s.ghOwner = ($('#syncGhOwner').value || '').trim();
    s.ghRepo = ($('#syncGhRepo').value || '').trim();
    s.ghBranch = ($('#syncGhBranch').value || '').trim() || 'main';
    s.ghPath = ($('#syncGhPath').value || '').trim() || 'wbsync_data.json';
    s.ghToken = ($('#syncGhToken').value || '').trim();
  } else {
    s.base = ($('#syncBase').value || '').trim();
  }
  s._hex = '';
  syncPersist();
  toast('已保存同步设置', 'ok');
  if (UI.page === 'set') render();
}
function syncToggleAuto() {
  var s = syncEnsure();
  s.auto = !s.auto; syncPersist();
  if (s.auto) { syncStartAuto(); toast('已开启自动同步（每 20 秒检查一次）', 'ok'); }
  else { clearInterval(syncIntT); syncIntT = null; toast('已关闭自动同步', 'ok'); }
  if (UI.page === 'set') render();
}
function syncFmtTime(ts) {
  if (!ts) return '还没有';
  try { return new Date(ts).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return new Date(ts).toLocaleString(); }
}

/* 诊断：逐项检查 令牌 / 仓库 / 文件 是否可达，直接告诉用户错在哪 */
async function syncTestConn() {
  var s = syncEnsure();
  var c = syncGHCfg();
  if (syncMode() !== 'github') { toast('当前不是 GitHub 模式，无需测试', 'err'); return; }
  if (!c.owner || !c.repo || !c.token) { toast('请先填好 用户名 / 仓库名 / 访问令牌', 'err'); return; }
  toast('正在测试连接…');
  try {
    /* 1) 仓库是否存在 + 令牌是否有效 */
    var r1 = await syncGHApi('/repos/' + c.owner + '/' + c.repo, { method: 'GET' });
    if (r1.status === 401) { toast('令牌无效或未登录：请检查 gh_… 令牌是否复制完整、是否过期', 'err'); return; }
    if (r1.status === 404) { toast('仓库不存在：用户名「' + c.owner + '」或仓库名「' + c.repo + '」填错了', 'err'); return; }
    if (!r1.ok) { var t1 = await r1.text(); throw new Error('仓库 HTTP ' + r1.status + (t1 ? '：' + t1.slice(0, 100) : '')); }
    var repoInfo = await r1.json();
    var defBranch = (repoInfo.default_branch || 'main');
    /* 2) 目标分支上的同步文件是否存在 */
    var p = '/repos/' + c.owner + '/' + c.repo + '/contents/' + encodeURIComponent(c.path) + '?ref=' + encodeURIComponent(c.branch);
    var r2 = await syncGHApi(p, { method: 'GET' });
    if (r2.status === 404) {
      var pOld = '/repos/' + c.owner + '/' + c.repo + '/contents/.wb_sync%2Fsync.json?ref=' + encodeURIComponent(c.branch);
      try { var rOld = await syncGHApi(pOld, { method: 'GET' }); if (rOld.ok) r2 = rOld; } catch (e) {}
    }
    if (r2.status === 404) {
      toast('仓库连上了 ✓，但分支「' + c.branch + '」上还没有同步文件（默认分支是 ' + defBranch + '）。先在电脑上点一次「立即上传」', 'err');
      return;
    }
    if (!r2.ok) { var t2 = await r2.text(); throw new Error('文件 HTTP ' + r2.status + (t2 ? '：' + t2.slice(0, 100) : '')); }
    toast('连接正常 ✓ 仓库、令牌、分支、文件都通。可点「立即拉取」', 'ok');
  } catch (e) { toast('测试失败：' + (e && e.message ? e.message : e), 'err'); }
}


/* ===================== 启动引导 ===================== */
(function(){
  function boot(){
    load();
    if(typeof syncStartAuto==='function')syncStartAuto();
    render();
    document.addEventListener('keydown', function(e){
      cmKey(e);
      if(CM.on) return;
      if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      if(e.key==='c' || e.key==='C'){ if(DB.classes.length) openClassMode(); }
    });
    var lp = document.getElementById('lockpin');
    if(lp) lp.addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
