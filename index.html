<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>班主任工作台</title>
<style>
/* ============ 基础与主题变量 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
:root{
  --bg:#f2f4f7; --panel:#ffffff; --panel2:#f8fafc; --line:#e3e7ee; --line2:#eef1f6;
  --tx:#1f2937; --tx2:#5b6676; --tx3:#8b95a5;
  --pri:#2563eb; --pri-bg:#e8f0ff; --pri-tx:#ffffff;
  --red:#d93a3a; --red-bg:#fdecec; --green:#1f9254; --green-bg:#e8f7ee;
  --orange:#c76a10; --orange-bg:#fdf1e0; --purple:#6d3fd1; --purple-bg:#f0eaff;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow2:0 8px 28px rgba(16,24,40,.14);
  --r:10px; --sb:208px; --fs:15px;
}
html[data-theme="dark"]{
  --bg:#12141a; --panel:#1b1f27; --panel2:#22262f; --line:#2c313b; --line2:#262a33;
  --tx:#e6e9ef; --tx2:#a3acbb; --tx3:#7b8494;
  --pri:#5b8cff; --pri-bg:#1e2a44; --pri-tx:#0e1116;
  --red:#ff6b6b; --red-bg:#3a1f22; --green:#4ecb8b; --green-bg:#172c22;
  --orange:#e8a44b; --orange-bg:#33261340; --purple:#a98cff; --purple-bg:#241f3a;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow2:0 10px 30px rgba(0,0,0,.55);
}
body{
  background:var(--bg); color:var(--tx); font-size:var(--fs);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",Roboto,sans-serif;
  line-height:1.55; overflow:hidden;
}
html[data-fs="big"]{--fs:17px}
html[data-fs="huge"]{--fs:19px}
a{color:var(--pri);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
svg{display:block}
.hidden{display:none !important}

/* ============ 布局 ============ */
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.sidebar{
  width:var(--sb);flex:0 0 var(--sb);background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;z-index:40
}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand b{font-size:16px;letter-spacing:.5px;display:block;line-height:1.2}
.brand span{font-size:12px;color:var(--tx3);display:block}
.nav{flex:1;overflow-y:auto;padding:6px 10px 10px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--tx2);
  font-size:calc(var(--fs) - 0px);margin-bottom:2px;cursor:pointer;position:relative;user-select:none
}
.nav a:hover{background:var(--panel2);color:var(--tx)}
.nav a.on{background:var(--pri-bg);color:var(--pri);font-weight:600}
html[data-theme="dark"] .nav a.on{color:#cbd9ff}
.nav a .ico{flex:0 0 auto;opacity:.9}
.nav a .dot{
  margin-left:auto;background:var(--red);color:#fff;font-size:11px;min-width:19px;height:19px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700
}
.nav .navsep{font-size:11px;color:var(--tx3);padding:12px 12px 6px;letter-spacing:1px}
.nav .nav-cat{font-size:12px;font-weight:700;color:var(--pri);padding:14px 12px 6px;letter-spacing:2px;display:flex;align-items:center;gap:6px}
.nav .nav-cat::before{content:'';width:3px;height:12px;background:var(--pri);border-radius:2px;display:inline-block}
.sidefoot{padding:10px 14px;border-top:1px solid var(--line2);font-size:12px;color:var(--tx3);display:flex;gap:8px;align-items:center;justify-content:space-between}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{
  height:58px;flex:0 0 58px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:0 14px;z-index:30
}
.topbar .pgtitle{font-weight:700;font-size:calc(var(--fs) + 2px);white-space:nowrap}
.topbar .grow{flex:1}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;scroll-behavior:smooth}
.wrap{max-width:1240px;margin:0 auto}
#hamb{display:none}

/* ============ 通用控件 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;
  border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:9px;cursor:pointer;
  font-size:calc(var(--fs) - 1px);font-family:inherit;font-weight:500;white-space:nowrap
}
.btn:hover{background:var(--panel2);border-color:var(--tx3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:var(--red-bg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--tx2)}
.btn.ghost:hover{background:var(--panel2);color:var(--tx)}
.btn.sm{min-height:30px;padding:3px 9px;font-size:calc(var(--fs) - 3px);border-radius:7px}
.btn.lg{min-height:46px;padding:10px 20px;font-size:calc(var(--fs) + 1px)}
.btn.icon{padding:7px;min-width:38px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--pri-bg);border-color:var(--pri);color:var(--pri)}
input,select,textarea{
  font-family:inherit;font-size:16px;color:var(--tx);background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%
}
@media(min-width:769px){input,select,textarea{font-size:calc(var(--fs) - 1px)}}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-bg);border-color:var(--pri)}
textarea{min-height:90px;resize:vertical;line-height:1.6}
label.fl{display:block;font-size:calc(var(--fs) - 3px);color:var(--tx2);margin:0 0 4px;font-weight:600}
.field{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.tight{gap:6px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.card>h3{margin:0 0 10px;font-size:calc(var(--fs) + 1px);display:flex;align-items:center;gap:8px}
.card>h3 .grow{flex:1}
.card.pad0{padding:0;overflow:hidden}
.card h3.ch{padding:12px 16px;border-bottom:1px solid var(--line2);margin:0}
.sub{color:var(--tx2);font-size:calc(var(--fs) - 3px)}
.mini{color:var(--tx3);font-size:calc(var(--fs) - 4px)}
.empty{padding:26px 14px;text-align:center;color:var(--tx3);font-size:calc(var(--fs) - 2px)}
hr{border:none;border-top:1px solid var(--line2);margin:12px 0}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:calc(var(--fs) - 4px);background:var(--panel2);color:var(--tx2);border:1px solid var(--line2);white-space:nowrap}
.tag.red{background:var(--red-bg);color:var(--red);border-color:transparent}
.tag.green{background:var(--green-bg);color:var(--green);border-color:transparent}
.tag.blue{background:var(--pri-bg);color:var(--pri);border-color:transparent}
.tag.orange{background:var(--orange-bg);color:var(--orange);border-color:transparent}
.tag.purple{background:var(--purple-bg);color:var(--purple);border-color:transparent}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{
  background:none;border:none;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;
  color:var(--tx2);font-size:var(--fs);font-family:inherit;font-weight:600;white-space:nowrap;min-height:42px
}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.tabs button:hover{color:var(--tx)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:9px;margin-bottom:10px;font-size:calc(var(--fs) - 1px);border:1px solid transparent}
.alert.red{background:var(--red-bg);color:var(--red);border-color:rgba(217,58,58,.25)}
.alert.orange{background:var(--orange-bg);color:var(--orange)}
.alert.blue{background:var(--pri-bg);color:var(--pri)}
.alert.green{background:var(--green-bg);color:var(--green)}
.alert .grow{flex:1}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--pri)}
.kpi b{display:block;font-size:32px;line-height:1.15;font-weight:700}
.kpi span{color:var(--tx2);font-size:calc(var(--fs) - 2px)}
.bar{height:8px;background:var(--line2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--pri-bg);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 auto}

/* ============ 统计卡片（左侧彩色边框，参考截图风格） ============ */
.statcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;align-items:flex-start;gap:14px;box-shadow:var(--shadow);cursor:default;transition:border-color .2s}
.statcard:hover{border-color:var(--tx3)}
.statcard .sc-left{flex:0 0 4px;border-radius:3px;align-self:stretch}
.statcard .sc-blue .sc-left{background:var(--pri)}
.statcard .sc-green .sc-left{background:var(--green)}
.statcard .sc-red .sc-left{background:var(--red)}
.statcard .sc-orange .sc-left{background:var(--orange)}
.statcard .sc-purple .sc-left{background:var(--purple)}
.statcard .sc-body{flex:1;min-width:0}
.statcard .sc-val{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.5px}
.statcard .sc-lbl{font-size:calc(var(--fs) - 1px);color:var(--tx2);margin-top:2px}
.statcard .sc-sub{font-size:calc(var(--fs) - 3px);color:var(--tx3);margin-top:4px}
.sc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media(max-width:768px){.sc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.statcard .sc-val{font-size:24px}}

/* ============ 仪表盘问候横幅 ============ */
.greetbar{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:16px;border-radius:14px;
  background:linear-gradient(135deg,var(--pri-bg),var(--panel));border:1px solid var(--line);flex-wrap:wrap}
.greetbar .gb-avat{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;color:#fff;background:linear-gradient(135deg,#f472b6,#db2777);flex:none;overflow:hidden}
.greetbar .gb-main{flex:1;min-width:200px}
.greetbar .gb-hi{font-size:calc(var(--fs) + 3px);font-weight:700;line-height:1.4}
.greetbar .gb-sub{font-size:calc(var(--fs) - 2px);color:var(--tx3);margin-top:2px}
.greetbar .gb-retire{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:8px 14px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);cursor:pointer;flex:none}
.greetbar .gb-retire:hover{border-color:var(--pri)}
.greetbar .gb-rd{font-size:calc(var(--fs) + 3px);font-weight:800;color:var(--pri);white-space:nowrap}
.greetbar .gb-rl{font-size:calc(var(--fs) - 3px);color:var(--tx3);white-space:nowrap}
@media(max-width:600px){.greetbar .gb-retire{align-items:flex-start;width:100%;flex-direction:row;align-items:center;justify-content:space-between}}

/* ============ 日历假期页 ============ */
.retire-badge{display:inline-flex;align-items:center;gap:4px;padding:7px 18px;border-radius:999px;
  background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-weight:600;cursor:pointer;
  font-size:calc(var(--fs) - 1px);box-shadow:0 2px 8px rgba(239,68,68,.25);user-select:none}
.retire-badge b{font-size:calc(var(--fs) + 3px);margin:0 2px}
.retire-badge.unset{background:linear-gradient(135deg,#9ca3af,#6b7280);box-shadow:none}
.cal-wrap{display:flex;gap:16px;align-items:stretch}
.cal-main{flex:1;min-width:0}
.cal-side{width:300px;flex:none;display:flex;flex-direction:column;gap:12px}
@media(max-width:1000px){.cal-wrap{flex-direction:column}.cal-side{width:100%;flex-direction:row;flex-wrap:wrap}.cal-side>*{flex:1;min-width:250px}}
@media(max-width:700px){.cal-side{flex-direction:column}}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-title{font-size:calc(var(--fs) + 4px);font-weight:800;min-width:110px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-wk{text-align:center;font-size:calc(var(--fs) - 2px);color:var(--tx3);padding:5px 0;font-weight:700}
.cal-cell{min-height:88px;border:1px solid var(--line);border-radius:10px;padding:5px 7px;cursor:pointer;
  background:var(--panel);display:flex;flex-direction:column;gap:1px;transition:all .12s;overflow:hidden}
.cal-cell:hover{border-color:var(--pri);box-shadow:var(--shadow);transform:translateY(-1px)}
.cal-cell.blank{background:transparent;border-color:transparent;cursor:default;min-height:0}
.cal-cell.blank:hover{transform:none;box-shadow:none;border-color:transparent}
.cal-cell.today{border:2px solid var(--pri);background:var(--pri-bg)}
.cal-cell.wk .cal-d{color:var(--red)}
.cal-d{font-size:calc(var(--fs) + 2px);font-weight:700;line-height:1.25}
.cal-lunar{font-size:calc(var(--fs) - 4px);color:var(--tx3);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-term{color:var(--red);font-weight:700}
.cal-tags{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;font-size:calc(var(--fs) - 4px);line-height:1.5}
.cal-fest{font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cal-fest.c1{color:var(--red)}
.cal-fest.c2{color:#a855f7}
.cal-fest.c3{color:var(--pri)}
.cal-fest.c4{color:var(--tx3)}
.cal-cust{font-size:calc(var(--fs) - 2px)}
.cal-dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
.cal-dot.h{background:#ef4444}.cal-dot.m{background:#eab308}.cal-dot.l{background:#22c55e}
.cal-hol-card{border-radius:14px;padding:16px 18px;color:#fff;background:linear-gradient(135deg,#2563eb,#7c3aed);
  display:flex;flex-direction:column;gap:3px;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.cal-hol-card .chc-lbl{font-size:calc(var(--fs) - 3px);opacity:.92}
.cal-hol-card .chc-name{font-size:calc(var(--fs) + 3px);font-weight:800;display:flex;align-items:center;gap:6px}
.cal-hol-card .chc-ico{font-size:22px}
.cal-hol-card .chc-big{font-size:calc(var(--fs) + 12px);font-weight:800;line-height:1.35}
.cal-hol-card .chc-big b{font-size:calc(var(--fs) + 16px)}
.cal-hol-card .chc-date{font-size:calc(var(--fs) - 3px);opacity:.92}
.cal-sidecard{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--panel)}
.cal-sidecard h4{margin:0 0 8px;font-size:calc(var(--fs) - 1px);font-weight:700}
.vac-big{font-size:calc(var(--fs) + 6px);font-weight:800;color:var(--pri);margin:2px 0}
.ico-pick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.ico-pick button{font-size:19px;padding:7px 0 5px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;line-height:1.3}
.ico-pick button span{display:block;font-size:10px;color:var(--tx3)}
.ico-pick button.on{border-color:var(--pri);background:var(--pri-bg)}
.hol-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.hol-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--panel2);flex:none}
.hol-days{white-space:nowrap;font-size:calc(var(--fs) - 2px);text-align:right}
@media(max-width:600px){.cal-cell{min-height:64px;padding:3px 4px}.cal-lunar{display:none}.cal-tags{font-size:9px}}

/* ============ 快捷操作按钮网格 ============ */
.quickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-bottom:18px}
.qaction{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer;transition:all .15s;user-select:none}
.qaction:hover{border-color:var(--pri);background:var(--pri-bg);transform:translateY(-1px);box-shadow:var(--shadow)}
.qaction:active{transform:translateY(0)}
.qaction .qa-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.qaction .qa-ico.bg-red{background:linear-gradient(135deg,#ef4444,#dc2626)}
.qaction .qa-ico.bg-blue{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.qaction .qa-ico.bg-green{background:linear-gradient(135deg,#22c55e,#16a34a)}
.qaction .qa-ico.bg-orange{background:linear-gradient(135deg,#f97316,#ea580c)}
.qaction .qa-ico.bg-purple{background:linear-gradient(135deg,#a855f7,#9333ea)}
.qaction .qa-ico.bg-teal{background:linear-gradient(135deg,#14b8a6,#0d9488)}
.qaction .qa-ico.bg-pink{background:linear-gradient(135deg,#ec4899,#db2777)}
.qaction .qa-ico.bg-gray{background:linear-gradient(135deg,#6b7280,#4b5563)}
.qaction .qa-txt{font-size:calc(var(--fs) - 2px);color:var(--tx);font-weight:500;text-align:center;white-space:nowrap}

/* ============ 首字头像（彩色圆圈+姓氏/名首字） ============ */
.avat{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex:0 0 auto;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1}
.avat.a-pink{background:linear-gradient(135deg,#f472b6,#ec4899)}
.avat.a-blue{background:linear-gradient(135deg,#60a5fa,#3b82f6)}
.avat.a-green{background:linear-gradient(135deg,#4ade80,#22c55e)}
.avat.a-orange{background:linear-gradient(135deg,#fb923c,#f97316)}
.avat.a-purple{background:linear-gradient(135deg,#c084fc,#a855f7)}
.avat.a-teal{background:linear-gradient(135deg,#2dd4bf,#14b8a6)}
.avat.a-red{background:linear-gradient(135deg,#f87171,#ef4444)}
.avat.a-yellow{background:linear-gradient(135deg,#fbbf24,#f59e0b)}

/* ============ 可视化座位网格（优化版） ============ */
.seatviz{display:inline-flex;flex-direction:column;gap:2px}
.seat-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;padding:0 4px}
.seat-card{background:linear-gradient(180deg,#e9eef6 0%,#dde5f1 100%);border-radius:16px;border:1px solid #c9d4e6;overflow:hidden;box-shadow:0 4px 18px rgba(60,80,120,.08)}
.sv-grid{display:flex;flex-direction:column;align-items:center;gap:5px;padding:18px 12px 12px}
.sv-row{display:flex;gap:5px;justify-content:center}
.sv-cell{width:68px;height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;transition:all .18s ease;position:relative;user-select:none;border:2px solid transparent}
.sv-cell:hover{transform:scale(1.07);box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:2}
.sv-cell.sv-dragging{opacity:.35;transform:scale(.94);cursor:grabbing}
.sv-cell.sv-dragover{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.35);background:#fff;z-index:3}
/* 性别颜色：男生蓝、女生粉 */
.sv-cell.sv-boy{background:linear-gradient(145deg,#e0f0ff,#c7e0ff);color:#1a56db;border-color:#a8c8fa}
.sv-cell.sv-boy:hover{border-color:#3b82f6;box-shadow:0 6px 20px rgba(59,130,246,.25)}
.sv-cell.sv-girl{background:linear-gradient(145deg,#fce7f3,#fad4e8);color:#be185d;border-color:#f9b8d4}
.sv-cell.sv-girl:hover{border-color:#ec4899;box-shadow:0 6px 20px rgba(236,72,153,.25)}
.sv-cell.sv-unk{background:linear-gradient(145deg,#f0f0f0,#e2e2e2);color:#666;border-color:#ccc}
.sv-cell.sv-aisle{background:transparent;border:2px dashed #c5d0e2;color:#9aa6bb;font-size:12px;border-radius:10px}
.sv-cell.sv-aisle:hover{border-color:#8fa4c4;background:rgba(200,215,240,.15)}
/* 讲台 */
.sv-pod-row{width:100%;margin-bottom:8px}
.sv-pod-inner{background:linear-gradient(135deg,#86efac,#4ade80,#22c55e);color:#064e3b;border-radius:10px;padding:10px 24px;text-align:center;font-size:15px;font-weight:700;letter-spacing:6px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 12px rgba(34,197,94,.3)}
/* 座位内容 */
.sv-cell .sv-pos{font-size:9px;opacity:.55;margin-bottom:1px;font-weight:500}
.sv-cell .sv-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px;line-height:1.2}
/* 图例 */
.sv-legend{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px 16px 14px;font-size:13px;color:var(--tx2)}
.sv-hint-txt{margin-left:6px;padding:3px 10px;border-radius:20px;background:rgba(59,130,246,.1);color:#3b82f6;font-size:12px;font-weight:500}
.sv-leg-dot{width:18px;height:18px;border-radius:5px;display:inline-block;vertical-align:middle;margin-right:4px}
.sv-boy-bg{background:linear-gradient(145deg,#c7e0ff,#93c5fd)}
.sv-girl-bg{background:linear-gradient(145deg,#fce7f3,#f9a8d4)}
.sv-vacant-bg{background:linear-gradient(145deg,#eef2f8,#d2dcec)}
.sv-aisle-bg{background:transparent;border:2px dashed #b0bdd0}
.sv-layouts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sv-layouts button{padding:6px 14px}

/* ============ 饼图（工作类型分布） ============ */
.pie-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.pie-svg{width:180px;height:180px;flex:0 0 auto}
.pie-legend{flex:1;min-width:160px}
.pl-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:calc(var(--fs) - 1px)}
.pl-dot{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.pl-cnt{margin-left:auto;font-weight:600;color:var(--tx)}

/* ============ 进度条（作业提交率等） ============ */
.progbar{display:flex;align-items:center;gap:10px;padding:6px 0}
.progbar .pb-lbl{min-width:160px;font-size:calc(var(--fs) - 1px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
.progbar .pb-track{flex:1;height:20px;background:var(--line2);border-radius:10px;overflow:hidden;position:relative}
.progbar .pb-fill{height:100%;border-radius:10px;transition:width .4s ease;min-width:0}
.progbar .pb-fill.pb-green{background:linear-gradient(90deg,#22c55e,#16a34a)}
.progbar .pb-fill.pb-orange{background:linear-gradient(90deg,#f97316,#ea580c)}
.progbar .pb-fill.pb-red{background:linear-gradient(90deg,#ef4444,#dc2626)}
.progbar .pb-pct{min-width:48px;text-align:right;font-weight:700;font-size:calc(var(--fs) - 1px);font-variant-numeric:tabular-nums}

/* ============ 学生卡片列表（参考截图6风格） ============ */
.stu-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.stu-item{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:all .15s}
.stu-item:hover{border-color:var(--pri);box-shadow:var(--shadow)}
.stu-del{position:absolute;top:6px;right:6px;width:22px;height:22px;display:none;align-items:center;justify-content:center;border:none;background:var(--red);color:#fff;border-radius:6px;cursor:pointer;padding:0;line-height:1;opacity:.92}
.stu-item:hover .stu-del{display:flex}
.stu-del:hover{opacity:1}
.stu-item .si-info{flex:1;min-width:0}
.stu-item .si-name{font-size:calc(var(--fs)+0px);font-weight:600}
.stu-item .si-meta{font-size:calc(var(--fs)-3px);color:var(--tx3)}
.stu-item .si-tags{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.stu-item .si-score{font-size:calc(var(--fs)+2px);font-weight:800;color:var(--red);flex:0 0 auto}

/* ============ 日程时间线 ============ */
.timeline{padding:4px 0}
.tl-group{margin-bottom:16px}
.tl-date{font-size:calc(var(--fs)+1px);font-weight:700;color:var(--tx);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.tl-date .tl-dow{font-size:calc(var(--fs)-2px);color:var(--tx3);font-weight:400}
.tl-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.tl-item:hover{border-color:var(--pri)}
.tl-item .tl-time{font-size:calc(var(--fs)+1px);font-weight:700;color:var(--pri);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.tl-item .tl-body{flex:1;min-width:0}
.tl-item .tl-title{font-size:calc(var(--fs)+0px);font-weight:600}
.tl-item .tl-sub{font-size:calc(var(--fs)-3px);color:var(--tx3);margin-top:2px}
.tl-item .tl-done{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--green);cursor:pointer}
.tl-item .tl-done.checked{background:var(--green);border-color:var(--green);color:#fff}

/* ============ 违纪/扣分列表项 ============ */
.disc-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.disc-item .di-avatar{flex:0 0 auto}
.disc-item .di-info{flex:1;min-width:0}
.disc-item .di-name{font-weight:600}
.disc-item .di-reason{font-size:calc(var(--fs)-2px);color:var(--tx2)}
.disc-item .di-score{font-size:calc(var(--fs)+3px);font-weight:800;color:var(--red);flex:0 0 auto;min-width:44px;text-align:right}
.disc-item .di-date{font-size:calc(var(--fs)-3px);color:var(--tx3);flex:0 0 auto}

/* ============ 活动类型标签 ============ */
.act-sports{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.act-meeting{background:#ede9fe;color:#5b21b6;border:1px solid #ddd6fe}
.act-edu{background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe}
.act-volunteer{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.act-other{background:#f3f4f6;color:#374151;border:1px solid #e5e7eb}

/* ============ 表格 ============ */
.tbwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:calc(var(--fs) - 1px)}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
th{background:var(--panel2);color:var(--tx2);font-weight:600;position:sticky;top:0;z-index:2;font-size:calc(var(--fs) - 3px)}
tbody tr:hover td{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.ctr,th.ctr{text-align:center}
.stick1{position:sticky;left:0;background:var(--panel);z-index:3}
th.stick1{z-index:4}
tbody tr:hover .stick1{background:var(--panel2)}
.tb-in{border:1px solid transparent;background:transparent;min-height:28px;padding:3px 6px;border-radius:5px;width:64px;text-align:right}
.tb-in:hover{border-color:var(--line)}
.cellbtn{min-width:44px;min-height:34px;border:1px solid var(--line);background:var(--panel2);border-radius:7px;cursor:pointer;font-size:calc(var(--fs) - 3px);font-family:inherit;color:var(--tx2);padding:2px 6px}
.linkish{color:var(--pri);cursor:pointer;text-decoration:none}
.linkish:hover{text-decoration:underline}
.strike{text-decoration:line-through;color:var(--tx3)}

/* ============ 弹窗 / 提示 ============ */
.modal-wrap{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow2);width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:980px}
.modal.narrow{max-width:420px}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.modal header b{font-size:calc(var(--fs) + 2px);flex:1}
.modal .body{padding:16px 18px;overflow-y:auto;flex:1}
.modal footer{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;padding-bottom:env(safe-area-inset-bottom)}
.toast{background:rgba(24,28,36,.94);color:#fff;padding:9px 16px;border-radius:22px;font-size:14px;box-shadow:var(--shadow2);animation:tin .2s ease}
.toast.ok{background:#1f7a48}.toast.err{background:#b3302f}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.savedot{font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:5px}
.savedot i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block}

/* ============ 锁屏 ============ */
.lock{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.lock .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:320px;text-align:center;box-shadow:var(--shadow2)}
.lock input{text-align:center;font-size:26px;letter-spacing:10px;margin:14px 0}

/* ============ 看板 / 座位 / 卡片 ============ */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:120px}
.kcol h4{margin:0 0 8px;font-size:calc(var(--fs) - 1px);display:flex;gap:6px;align-items:center}
.kitem{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:grab;font-size:calc(var(--fs) - 2px)}
.kitem:hover{border-color:var(--pri)}
.seatgrid{display:grid;gap:8px;justify-content:center}
.seat{border:1px dashed var(--line);border-radius:8px;min-height:52px;display:flex;align-items:center;justify-content:center;background:var(--panel2);font-size:calc(var(--fs) - 2px);cursor:pointer;text-align:center;padding:4px;user-select:none}
.seat.has{border-style:solid;background:var(--panel);border-color:var(--line)}
.seat.has:hover{border-color:var(--pri);background:var(--pri-bg)}
.seat.over{border-color:var(--pri);background:var(--pri-bg)}
.seat.hit{background:var(--pri);color:#fff;border-color:var(--pri)}
.stucard{border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center;cursor:pointer;background:var(--panel);position:relative;user-select:none;overflow:hidden}
.stucard:hover{border-color:var(--pri)}
.stucard.dim{opacity:.38}
.stucard.sel{border-color:var(--pri);background:var(--pri-bg)}
.stucard.st-a{border-color:var(--red);background:var(--red-bg)}
.stucard.st-a b{color:var(--red)}
.stucard.st-l{border-color:var(--orange);background:var(--orange-bg)}
.stucard.st-l b{color:var(--orange)}
.stucard.st-v{border-color:var(--pri);background:var(--pri-bg)}
.stucard.st-v b{color:var(--pri)}
.stucard .stag{position:absolute;right:4px;top:2px;font-size:10px;color:var(--tx3);line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:calc(var(--fs) - 3px);color:var(--tx2)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.vbars{display:flex;align-items:flex-end;gap:6px;height:130px;padding:8px 2px 0}
.vbars .vb{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.vbars .vb i{display:block;width:72%;background:var(--pri);border-radius:5px 5px 0 0;min-height:2px}
.vbars .vb u{text-decoration:none;font-size:calc(var(--fs) - 4px);color:var(--tx2)}
.vbars .vb s{text-decoration:none;font-size:calc(var(--fs) - 5px);color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gridcell{min-width:46px;text-align:center;padding:4px 6px}
/* 收交登记横向滚动 */
.hw-scroll-wrap{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.hw-scroll-wrap .tbwrap{border:none;border-radius:0;overflow-x:auto;overflow-y:auto}
.hw-scroll-wrap .tbwrap table{min-width:100%}
.hw-th{padding:4px 4px;font-size:calc(var(--fs) - 2px);line-height:1.3;min-width:76px;max-width:140px;white-space:normal}
.hw-th-title{display:block;font-weight:600;white-space:normal;word-break:break-all}
.hw-th-meta{display:block;font-size:calc(var(--fs) - 4px);color:var(--tx3);margin:1px 0}
.hw-cell{padding:4px 4px;font-size:calc(var(--fs) - 2px);white-space:normal;min-width:76px}
.flip{transform:rotate(180deg)}
.stucard b{display:block;font-size:calc(var(--fs) - 1px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stucard s{display:block;text-decoration:none;color:var(--tx3);font-size:calc(var(--fs) - 5px)}
.pop{position:absolute;left:0;right:0;top:6px;text-align:center;font-weight:800;color:var(--green);pointer-events:none;animation:pop 1s ease forwards;font-size:20px}
.pop.minus{color:var(--red)}
@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.7)}25%{opacity:1;transform:translateY(-2px) scale(1.1)}100%{opacity:0;transform:translateY(-26px) scale(1)}}
.dragging{opacity:.4}
.drop-line{border-top:2px solid var(--pri) !important}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:calc(var(--fs) - 2px);min-height:34px}
.chip:hover{border-color:var(--pri);background:var(--pri-bg)}
.chip.neg{color:var(--red)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* 仪表盘快捷操作网格 */
.quickgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:8px}
@media(max-width:768px){.quickgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.qaction{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:all .15s}
.qaction:hover{border-color:var(--pri);box-shadow:var(--shadow);transform:translateY(-2px)}
.qa-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
.qa-txt{font-size:calc(var(--fs) - 2px);text-align:center;color:var(--tx)}
.bg-red{background:var(--red)}.bg-blue{background:var(--pri)}.bg-green{background:var(--green)}.bg-orange{background:var(--orange)}.bg-purple{background:var(--purple)}.bg-teal{background:#14b8a6}.bg-pink{background:#ec4899}.bg-gray{background:var(--tx3)}
.hbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(18px,1fr));gap:4px}
.hbox i{display:block;aspect-ratio:1;border-radius:4px;background:var(--line2)}
.hbox i.on{background:var(--green)}
.hbox i.today{outline:2px solid var(--pri)}

/* ============ 上课模式 ============ */
.cm{position:fixed;inset:0;background:#0b0d11;color:#fff;z-index:300;display:flex;flex-direction:column}
.cm .cmtop{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #22262e;flex-wrap:wrap}
.cm .cmtop b{font-size:20px;margin-right:6px}
.cm .cmtab{background:#1a1e26;border:1px solid #2b313c;color:#c9d1de;border-radius:9px;padding:8px 14px;cursor:pointer;font-size:16px;font-family:inherit;min-height:44px}
.cm .cmtab.on{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:700}
.cm .cmbody{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column}
.cm .huge{font-size:min(19vw,210px);font-weight:800;line-height:1.05;text-align:center;letter-spacing:4px}
.cm .big{font-size:min(9vw,80px);font-weight:800;text-align:center}
.cm .mid{font-size:min(4vw,30px);text-align:center;color:#aab4c4}
.cm .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.cm .cmbtn{background:#2563eb;color:#fff;border:none;border-radius:12px;padding:14px 34px;font-size:22px;cursor:pointer;font-family:inherit;font-weight:700;min-height:56px}
.cm .cmbtn.gray{background:#2b313c}
.cm .cmbtn.red{background:#b3302f}
.cm .votebar{display:flex;align-items:flex-end;gap:22px;height:44vh;justify-content:center;width:100%}
.cm .vcol{display:flex;flex-direction:column;align-items:center;gap:8px;flex:0 0 110px}
.cm .vcol i{display:block;width:100%;background:linear-gradient(180deg,#4a86ff,#2563eb);border-radius:10px 10px 0 0;min-height:3px;transition:height .3s}
.cm .vcol b{font-size:34px}
.cm .cmcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.cm .cmcard{background:#1a1e26;border:1px solid #2b313c;border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;font-size:19px;position:relative;overflow:hidden;user-select:none}
.cm .cmcard.dim{opacity:.32}
.cm .cmcard.sel{border-color:#2563eb;background:#1e2a44}
.cm .cmcard small{display:block;color:#8b95a5;font-size:13px}
.cm .rank{background:#1a1e26;border-radius:10px;padding:10px 12px;font-size:17px}
.cm .rank div{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #22262e}
.cm .seat{background:#1a1e26;border-color:#2b313c;color:#dde3ec;font-size:17px;min-height:58px}
.cm .seat.hit{background:#2563eb;color:#fff}
.cm .wheel{width:min(58vh,420px);height:min(58vh,420px);position:relative}
.cm .wpin{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:26px;color:#ffd166}
.spin{animation:spin .35s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ 打印 ============ */
.printarea{display:none}
@media print{
  html,body{overflow:visible !important;height:auto !important;background:#fff !important;color:#000 !important;font-size:12pt}
  body.printing .app,body.printing .modal-wrap,body.printing .toast-wrap,body.printing .cm{display:none !important}
  body.printing .printarea{display:block !important}
  .printarea{padding:0}
  .printarea h1{font-size:19pt;margin:0 0 4pt;text-align:center}
  .printarea h2{font-size:14pt;margin:14pt 0 6pt;border-bottom:1px solid #999;padding-bottom:3pt}
  .printarea .pmeta{text-align:center;color:#444;font-size:10pt;margin-bottom:10pt}
  .printarea table{width:100%;border-collapse:collapse;font-size:10.5pt}
  .printarea th,.printarea td{border:1px solid #666;padding:4pt 6pt;white-space:normal}
  .printarea th{background:#eee !important}
  .printarea .pcard{border:1px solid #666;padding:8pt;margin:0 0 8pt;page-break-inside:avoid}
  .printarea .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8pt}
  .printarea .pbreak{page-break-before:always}
  @page{margin:14mm}
}

/* ============ 移动端 ============ */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow2);width:250px;flex-basis:250px}
  .sidebar.open{transform:none}
  #hamb{display:inline-flex}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
  .view{padding:12px 12px calc(26px + env(safe-area-inset-bottom))}
  .g2,.g3,.g4,.kanban{grid-template-columns:1fr}
  .g4.keep2,.g2.keep2{grid-template-columns:1fr 1fr}

function icon(n,s,cls){s=s||18;var p=(IC[n]||'').split('|').map(function(d){return '<path d="'+d+'"/>'}).join('');
return '<svg class="ico '+(cls||'')+'" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'}

/* ---------- 提示 / 弹窗 ---------- */
function toast(msg,type){var w=$('#toast');var d=document.createElement('div');d.className='toast '+(type||'');d.textContent=msg;w.appendChild(d);
setTimeout(function(){d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(function(){d.remove()},320)},1900)}
function modal(o){
  var id='m'+uid();
  var html='<div class="modal-wrap" id="'+id+'"><div class="modal '+(o.cls||'')+'">'+
   '<header><b>'+h(o.title||'')+'</b><button class="btn icon ghost" onclick="closeModal(\''+id+'\')">'+icon('x',18)+'</button></header>'+
   '<div class="body">'+(o.body||'')+'</div>'+(o.footer?'<footer>'+o.footer+'</footer>':'')+'</div></div>';
  $('#modalHost').insertAdjacentHTML('beforeend',html);
  var w=$('#'+id);
  w.addEventListener('mousedown',function(e){if(e.target===w&&!o.sticky)closeModal(id)});
  if(o.after)o.after(id);
  return id;
}
function closeModal(id){var e=id?$('#'+id):null;if(e)e.remove();else $('#modalHost').innerHTML=''}
function closeTopModal(){var l=$$('#modalHost .modal-wrap');if(l.length)l[l.length-1].remove()}
function ask(msg,cb,o){
  o=o||{};

    body:'<div style="font-size:calc(var(--fs) + 0px);line-height:1.7">'+msg+'</div>'+(o.note?'<div class="mini" style="margin-top:8px">'+o.note+'</div>':''),
    footer:'<button class="btn" data-no>取消</button><button class="btn '+(o.danger?'danger':'pri')+'" data-yes>'+(o.ok||'确定')+'</button>',
    after:function(id){
      $('#'+id+' [data-no]').onclick=function(){closeModal(id)};
      $('#'+id+' [data-yes]').onclick=function(){closeModal(id);cb()};
    }});
  return id;

/* 通用表单弹窗：fields=[{k,label,type,val,opts,ph,full,rows,min,max,note}] */
function formModal(title,fields,onOk,o){
  o=o||{};
  var body='<div class="grid g2">'+fields.map(function(f,i){
    var full=(f.full||f.type==='textarea')?'grid-column:1/-1;':'';
    var inp='';
    var idn='ff'+i;
    if(f.type==='select') inp='<select id="'+idn+'">'+(f.opts||[]).map(function(op){var v=op.v!==undefined?op.v:op,t=op.t!==undefined?op.t:op;
        return '<option value="'+h(v)+'"'+(String(f.val)===String(v)?' selected':'')+'>'+h(t)+'</option>'}).join('')+'</select>';
    else if(f.type==='textarea') inp='<textarea id="'+idn+'" rows="'+(f.rows||4)+'" placeholder="'+h(f.ph||'')+'">'+h(f.val||'')+'</textarea>';
    else if(f.type==='check') inp='<label class="row tight" style="min-height:38px"><input type="checkbox" id="'+idn+'" style="width:20px;height:20px;min-height:20px"'+(f.val?' checked':'')+'><span>'+h(f.ph||'是')+'</span></label>';
    else inp='<input id="'+idn+'" type="'+(f.type||'text')+'" value="'+h(f.val==null?'':f.val)+'" placeholder="'+h(f.ph||'')+'"'+(f.min!==undefined?' min="'+f.min+'"':'')+(f.max!==undefined?' max="'+f.max+'"':'')+(f.step?' step="'+f.step+'"':'')+'>';
    return '<div class="field" style="'+full+'"><label class="fl">'+h(f.label)+'</label>'+inp+(f.note?'<div class="mini" style="margin-top:3px">'+f.note+'</div>':'')+'</div>';
  }).join('')+'</div>'+(o.note?'<div class="alert blue">'+o.note+'</div>':'');
  var id=modal({title:title,cls:o.cls||'',sticky:true,body:body,
    footer:'<button class="btn" data-no>取消</button><button class="btn pri" data-yes>'+(o.ok||'保存')+'</button>',
    after:function(id){
      var root=$('#'+id);
      $('[data-no]',root).onclick=function(){closeModal(id)};
      function submit(){
        var v={};
        fields.forEach(function(f,i){var e=$('#ff'+i,root);
          v[f.k]=f.type==='check'?e.checked:(f.type==='number'?nb(e.value,null):e.value)});
        if(onOk(v)!==false)closeModal(id);
      }
      $('[data-yes]',root).onclick=submit;
      root.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();submit()}});
      var f0=$('#ff0',root);if(f0)setTimeout(function(){f0.focus();if(f0.select)f0.select()},60);
    }});

}

/* ---------- 存储 ---------- */
function save(now){
  DB.meta.updated=Date.now();
  clearTimeout(saveTimer);
  var go=function(){
    try{localStorage.setItem(KEY,JSON.stringify(DB));flashSave()}
    catch(e){toast('保存失败：浏览器存储空间可能已满','err')}
    if(!SYNCING&&typeof syncSchedulePush==='function')syncSchedulePush();
  };
  if(now)go();else saveTimer=setTimeout(go,260);
}
function flashSave(){var d=$('#saveDot');if(!d)return;d.style.opacity='.45';setTimeout(function(){d.style.opacity='1'},220);
  var si=$('#storeInfo');if(si)si.textContent=storeSize()}
function storeSize(){try{var n=(localStorage.getItem(KEY)||'').length;return n>1048576?(n/1048576).toFixed(2)+' MB':Math.round(n/1024)+' KB'}catch(e){return '—'}}
function pushUndo(label){
  try{UNDO.push({label:label,at:Date.now(),data:JSON.stringify(DB)});if(UNDO.length>25)UNDO.shift()}catch(e){}
}
function undoLast(){
  if(!UNDO.length){toast('没有可撤销的操作');return}
  var u=UNDO.pop();DB=JSON.parse(u.data);save(true);render();toast('已撤销：'+u.label,'ok');
}
function trashPut(kind,label,data){
  DB.trash.unshift({id:uid(),kind:kind,label:label,at:Date.now(),data:JSON.parse(JSON.stringify(data))});

    periods:defPeriods(),tags:defTags(),cards:defCards(),hide:[],pin:'',lockOn:false,ai:{key:'',url:'',model:''},creditGoal:72,hwLimit:60,pass:0.6,good:0.85,updated:Date.now(),v:1,
    vac:{summer:{s:'',e:''},winter:{s:'',e:''}},retire:''};

/* ---------- 常用取数 ---------- */
function mondayOf(s){var d=pd(s),w=d.getDay()||7;return addD(s,1-w)}

function lessonsOn(d,classId){
  if(holidayOf(d))return [];
  var wk=weekOf(d),dy=dow(d),out=[];
  DB.timetable.forEach(function(t){
    if(t.day!==dy)return;
    if(t.wt==='odd'&&wk%2===0)return;
    if(t.wt==='even'&&wk%2===1)return;
    if(classId&&t.classId!==classId)return;
    out.push(t);
  });
  // 调课/代课当天补充
  return sortBy(out,function(t){return t2m(periodById(t.pi).s)});

function copyText(t,msg){

  else if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast(msg||'已复制','ok')},function(){showCopyBox(t)});

}

  after:function(){var e=$('#cpbox');e.focus();e.select()}})}
function dl(name,text,mime){
  var b=new Blob([text],{type:(mime||'text/plain')+';charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
  toast('已下载：'+name,'ok');
}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}

function parseTable(txt){
  return String(txt||'').replace(/\r/g,'').split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){
    if(l.indexOf('\t')>=0)return l.split('\t').map(function(x){return x.trim()});
    if(l.indexOf(',')>=0)return l.split(',').map(function(x){return x.trim()});
    return l.split(/\s+/);
  });
}

function statCard(clsColor,val,lbl,sub,onclick){
  return '<div class="statcard sc-'+clsColor+'"'+(onclick?' onclick="'+onclick+'" style="cursor:pointer"':'')+'>'+
    '<div class="sc-left"></div><div class="sc-body">'+
    '<div class="sc-val">'+val+'</div>'+

    (sub?'<div class="sc-sub">'+sub+'</div>':'')+'</div></div>';
}
function kpi(n,t,f,c){return '<div class="kpi" onclick="'+f+'"><b'+(c?' style="color:var(--red)"':'')+'>'+n+'</b><span>'+t+'</span></div>'}
function nextLesson(){
  var t=today(),now=nowMin();
  var ls=lessonsOn(t);
  for(var i=0;i<ls.length;i++){if(t2m(periodById(ls[i].pi).e)>=now)return {t:ls[i],d:t}}
  for(var k=1;k<=10;k++){var d=addD(t,k),l2=lessonsOn(d);if(l2.length)return {t:l2[0],d:d}}
  return null;
}
function countdownText(nx){
  if(nx.d!==today())return fmtD(nx.d);
  var m=t2m(periodById(nx.t.pi).s)-nowMin();
  if(m<=0)return '正在上课';
  if(m>=60)return Math.floor(m/60)+'小时'+(m%60)+'分';
  return m+' 分钟';
}

function progressMap(cid){
  var out=[],d=DB.meta.start,end=addD(DB.meta.start,DB.meta.weeks*7),i=0,guard=0;
  while(i<DB.prog.length&&d<end&&guard++<400){
    var ls=lessonsOn(d,cid);
    for(var k=0;k<ls.length&&i<DB.prog.length;k++){out.push({d:d,p:ls[k].pi});i++}
    d=addD(d,1);
  }
  return out;
}

function clsRoll(){
  var c=curClass(),ss=studs(c);
  var q=(UI.sel.sq||'').trim();
  var sg=UI.sel.sg||'all', sgrp=UI.sel.sgrp||'all';
  var grps=[];ss.forEach(function(s){if(s.grp&&grps.indexOf(s.grp)<0)grps.push(s.grp)});grps.sort(function(a,b){return a-b});
  var list=ss.filter(function(s){
    if(q&&(s.name+s.no+(s.focus||'')+(s.note||'')+(s.role||'')).indexOf(q)<0)return false;
    if(sg!=='all'&&(s.sex||'')!==sg)return false;
    if(sgrp!=='all'&&String(s.grp)!==String(sgrp))return false;
    return true;
  });
  var boys=ss.filter(function(s){return s.sex==='男'}).length;
  var girls=ss.length-boys;
  var cadres=ss.filter(function(s){return s.role}).length;
  var focus=ss.filter(function(s){return s.focus}).length;

  var out='<div class="sc-grid">'+
    statCard('blue',ss.length,'总人数',ss.length+' 人','')+
    statCard('green',boys,'男生',(ss.length?Math.round(boys/ss.length*100):0)+'%','')+
    statCard('purple',girls,'女生',(ss.length?Math.round(girls/ss.length*100):0)+'%','')+
    statCard('orange',cadres,'班干部',focus?('重点关注 '+focus+' 人'):'','')+
  '</div>';

  out+='<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:10px">'+
    '<input placeholder="搜索姓名 / 学号 / 电话 / 职务" value="'+h(q)+'" oninput="UI.sel.sq=this.value;clearTimeout(UI.tmp.st);UI.tmp.st=setTimeout(render,240)" style="max-width:300px">'+
    clsChip('sg','all','全部性别')+clsChip('sg','男','男')+clsChip('sg','女','女')+
    '<span class="grow"></span>'+
    '<button class="btn pri sm" onclick="editStu()">'+icon('plus',15)+'加学生</button>'+
    '<button class="btn sm" onclick="pasteRoll()">'+icon('up',15)+'粘贴名单</button>'+
    '<button class="btn sm" onclick="exportRoll()">'+icon('down',15)+'导出</button>'+
    '<button class="btn sm" onclick="printRoll()">'+icon('print',15)+'打印</button>'+
   '<button class="btn sm danger" style="margin-left:4px" onclick="clearAllStus()">'+icon('trash',15)+'清空名册</button>'+
   '<button class="btn sm danger" onclick="batchDelStus()">'+icon('x',15)+'批量删除</button>'+
  '</div>';

  if(grps.length)out+='<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:12px">'+
    clsChip('sgrp','all','全部小组')+grps.map(function(g){return clsChip('sgrp',g,'第'+g+'组')}).join('')+'</div>';

  if(!list.length)out+='<div class="empty">没有匹配的学生，换个筛选条件试试</div>';
  else out+='<div class="stu-list">'+(list.map(function(s){
    return '<div class="stu-item" onclick="openStu(\''+s.id+'\')">'+
      '<button class="stu-del" title="删除该学生" onclick="event.stopPropagation();delStu(\''+s.id+'\')">'+icon('x',13)+'</button>'+
      avatHtml(sname(s))+
      '<div class="si-info"><div class="si-name">'+h(sname(s))+'</div>'+
        '<div class="si-tags">'+(s.role?'<span class="tag blue">'+h(s.role)+'</span>':'')+(s.focus?'<span class="tag red">'+h(s.focus)+'</span>':'')+'</div>'+
        '<div class="si-meta">学号 '+h(s.no)+' · '+(s.grp?('第'+h(s.grp)+'组'):'未分组')+'</div></div>'+
      '<div class="si-score">'+pointsOf(s.id)+'</div>'+
    '</div>';
  }).join(''))+'</div>';
  return out;

function doPasteRoll(){
  var c=curClass(),txt=$('#pr').value,clear=$('#prClear').checked;
  var rows=parseTable(txt);
  if(!rows.length){toast('没有识别到内容','err');return}
  var add=[];
  rows.forEach(function(r,i){
    if(r.length===1&&/^(学号|姓名|序号)/.test(r[0]))return;
    if(r.length>1&&/姓名/.test(r.join('')))return;
    var no='',name='',sex='',grp='';
    r.forEach(function(cell){
      if(!cell)return;
      if(/^[男女]$/.test(cell)){sex=cell;return}
      if(/^(男生|女生)$/.test(cell)){sex=cell.charAt(0);return}
      if(/^\d{1,4}$/.test(cell)&&!no){no=cell;return}
      if(/^第?\d+组$/.test(cell)){grp=cell.replace(/\D/g,'');return}
      if(!name&&/[\u4e00-\u9fa5A-Za-z]/.test(cell)){name=cell.replace(/\s/g,'');return}
    });
    if(!name)return;
    add.push({id:uid(),no:no||String(add.length+1),name:name,sex:sex||'',grp:grp,focus:'',note:'',contacts:[]});
  });
  if(!add.length){toast('一个都没认出来，检查一下格式','err');return}
  pushUndo('批量导入名单');
  if(clear){trashPut('名册',c.name+' 旧名册',{classId:c.id,students:c.students});c.students=[]}
  c.students=c.students.concat(add);
  save();closeTopModal();render();toast('成功导入 '+add.length+' 人','ok');
}

function randGroup(){
  var c=curClass();
  formModal('随机分组 · '+c.name,[
    {k:'mode',label:'怎么分',type:'select',opts:[{v:'n',t:'一共分几组'},{v:'p',t:'每组几个人'}],val:'n'},
    {k:'num',label:'数量',type:'number',val:7,min:1}],function(v){
    var ss=studs(c).slice();
    for(var i=ss.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ss[i];ss[i]=ss[j];ss[j]=t}
    var n=Math.max(1,nb(v.num,6)),groups=[];
    var gcount=v.mode==='n'?n:Math.ceil(ss.length/n);
    for(var g=0;g<gcount;g++)groups.push({name:'第'+(g+1)+'组',ids:[]});
    ss.forEach(function(s,i){groups[i%gcount].ids.push(s.id)});
    pushUndo('随机分组');
    c.groups=groups;
    groups.forEach(function(g,gi){g.ids.forEach(function(id){var s=findStu(id);if(s)s.grp=String(gi+1)})});
    save();render();toast('已分成 '+gcount+' 组','ok');
  });
}

RENDER.cls_after=function(){
  var g=$('#seatGrid');if(!g)return;
  var from=null;
  $$('.seat',g).forEach(function(el){
    el.addEventListener('dragstart',function(){from=el.dataset.k});
    el.addEventListener('dragover',function(e){e.preventDefault();el.classList.add('over')});
    el.addEventListener('dragleave',function(){el.classList.remove('over')});
    el.addEventListener('drop',function(e){e.preventDefault();el.classList.remove('over');
      if(!from)return;swapSeat(from,el.dataset.k);from=null});
  });
};
function curSeat(){return DB.seats.filter(function(s){return s.id===UI.sel.seat})[0]}
function swapSeat(a,b){
  var st=curSeat();if(!st||a===b)return;
  pushUndo('调座位');
  var x=st.map[a],y=st.map[b];
  if(y)st.map[a]=y;else delete st.map[a];
  if(x)st.map[b]=x;else delete st.map[b];
  save();render();
}
function seatClick(k){
  var st=curSeat();
  if(UI.sel.pickStu){pushUndo('排座位');st.map[k]=UI.sel.pickStu;UI.sel.pickStu=null;save();render();return}
  if(st.map[k]){
    var sid=st.map[k];
    ask('把 <b>'+h(snameById(sid))+'</b> 从这个座位上移走？',function(){pushUndo('移走座位');delete st.map[k];save();render()});
  }else toast('先在下面点一个学生，再点座位');
}

    ({roll:attRoll,leave:attLeave,month:attMonth,stat:attStat}[tab])();
};

function attKpi(t,v,col){
  return '<div class="kpi" style="cursor:default"><b'+(col?' style="color:'+col+'"':'')+'>'+v+'</b><span>'+t+'</span></div>';
}
function attCardHTML(cid,d,s){
  var st=attState(cid,d,s.id);
  return '<div class="stucard'+(st==='p'?'':' st-'+st)+'" id="ac_'+s.id+'" onclick="cycleAtt(\''+s.id+'\')" oncontextmenu="attPick(event,\''+s.id+'\')">'+
    '<span class="stag">'+h(s.no||'')+'</span><b>'+h(sname(s))+'</b>'+
    '<s>'+(st==='p'?'出勤':ATT[st].t)+'</s></div>';
}
function cycleAtt(sid){
  var c=curClass(),d=attDate(),cid=c.id;
  var cur=attState(cid,d,sid),nx=ATTSEQ[(ATTSEQ.indexOf(cur)+1)%4];
  var rec=attRecord(cid,d,true);
  if(nx==='p')delete rec[sid];else rec[sid]=nx;
  if(!Object.keys(rec).length){/* 保留空对象，代表“这天点过名，全到” */}
  save();
  var el=$('#ac_'+sid),s=findStu(sid);
  if(el){el.outerHTML=attCardHTML(cid,d,s);}
  attRefreshCounts();
}
function attRefreshCounts(){
  var c=curClass(),d=attDate(),o=attCounts(c.id,d);
  var k=$$('#view .kpi b'),lab=[o.n,o.real,o.a,o.l,o.v,pct(o.real,o.n)+'%'];
  if(k.length>=6)for(var i=0;i<6;i++)k[i].textContent=lab[i];
}
function attPick(e,sid){
  e.preventDefault();
  var c=curClass(),d=attDate();
  var b=ATTSEQ.map(function(k){return '<button class="btn '+(attState(c.id,d,sid)===k?'on':'')+'" onclick="setAtt(\''+sid+'\',\''+k+'\')">'+(k==='p'?'出勤':ATT[k].t)+'</button>'}).join('');
  modal({title:snameById(sid)+' · '+fmtD(d),body:'<div class="row">'+b+'</div><div class="mini" style="margin-top:8px">小提示：平时直接点卡片循环切换更快，这个菜单是给需要一次点准的时候用的。</div>',footer:'<button class="btn" onclick="closeModal()">关闭</button>'});
}
function setAtt(sid,st){
  var c=curClass(),d=attDate(),rec=attRecord(c.id,d,true);
  if(st==='p')delete rec[sid];else rec[sid]=st;
  save();closeModal();render();
}
function allPresent(){
  var c=curClass(),d=attDate();
  pushUndo('考勤：全部到齐');
  DB.att[attKey(c.id,d)]={};save();render();toast('已记成全员到齐','ok');
}
function delAttDay(){
  var c=curClass(),d=attDate(),k=attKey(c.id,d);
  if(!DB.att[k]){toast('这天还没登记数据','err');return}
  ask('删除 <b>'+fmtDW(d)+'</b> 这天的全部考勤记录？<br><span class="mini">包括点名状态、备注等，删除后可以从「设置 → 回收站」找回。</span>',function(){
    pushUndo('删除考勤记录');
    trashPut('考勤记录',c.name+' '+fmtDW(d),{classId:c.id,date:d,att:JSON.parse(JSON.stringify(DB.att[k]||{})),note:(DB.attNote||{})[k]||''});
    delete DB.att[k];if(DB.attNote)delete DB.attNote[k];save();render();toast('已删除这天的考勤记录','ok');
  },{danger:true});
}
function setAttNote(v){
  if(!DB.attNote)DB.attNote={};
  DB.attNote[attKey(curClass().id,attDate())]=v;save();
}
function attRecent(){
  var c=curClass(),rows=[],d=today();
  for(var i=0;i<14;i++){
    var dd=addD(d,-i),rec=attOf(c.id,dd);
    if(dow(dd)>5&&!rec)continue;
    var o=attCounts(c.id,dd);
    rows.push('<tr'+(dd===attDate()?' style="background:var(--pri-bg)"':'')+'><td><span class="linkish" onclick="setAttDate(\''+dd+'\')">'+fmtDW(dd)+'</span></td>'+

      '<td class="num">'+(rec?o.real+' / '+o.n:'—')+'</td>'+
      '<td>'+(rec?attNames(c.id,dd,'a'):'—')+'</td><td>'+(rec?attNames(c.id,dd,'l'):'—')+'</td><td>'+(rec?attNames(c.id,dd,'v'):'—')+'</td></tr>');
  }
  return '<div class="card"><h3>'+icon('clock',18)+'最近两周（点日期可以补录）</h3>'+
    '<div class="tbwrap"><table><thead><tr><th style="width:120px">日期</th><th style="width:90px">状态</th><th class="num" style="width:90px">实到/应到</th><th>缺勤</th><th>迟到</th><th>请假</th></tr></thead><tbody>'+
    rows.join('')+'</tbody></table></div></div>';
}
function attNames(cid,d,st){
  var rec=attOf(cid,d)||{},o=[];
  studs(classById(cid)).forEach(function(s){if(rec[s.id]===st)o.push(sname(s))});
  return o.length?'<span class="'+(st==='a'?'tag red':st==='l'?'tag orange':'tag blue')+'">'+h(o.join('、'))+'</span>':'<span class="mini">无</span>';
}
function copyAtt(){
  var c=curClass(),d=attDate(),o=attCounts(c.id,d);
  function nm(st){var rec=attOf(c.id,d)||{},a=[];studs(c).forEach(function(s){if(rec[s.id]===st)a.push(sname(s))});return a}
  var t=c.name+' '+fmtDW(d)+' 考勤\n应到 '+o.n+' 人，实到 '+o.real+' 人。\n';
  var a=nm('a'),l=nm('l'),v=nm('v');
  t+='缺勤 '+a.length+' 人'+(a.length?'：'+a.join('、'):'')+'\n';
  t+='迟到 '+l.length+' 人'+(l.length?'：'+l.join('、'):'')+'\n';
  t+='请假 '+v.length+' 人'+(v.length?'：'+v.join('、'):'')+'\n';
  var note=(DB.attNote||{})[attKey(c.id,d)];if(note)t+='备注：'+note+'\n';
  copyText(t,'考勤汇报文字已复制，可以直接发给教导处');
}
function printAttDay(){
  var c=curClass(),d=attDate(),o=attCounts(c.id,d),rec=attOf(c.id,d)||{};
  var rows=studs(c).map(function(s){var st=rec[s.id]||'p';return [s.no,s.name,st==='p'?'√':ATT[st].t,'']});

    '<div class="alert blue">'+icon('bell',18)+'<div class="grow">写清起止日期，系统会<b>自动把这几天的考勤标成请假</b>（周末和放假日自动跳过），你不用一天一天点。</div></div>'+
    (list.length?'<div class="tbwrap"><table><thead><tr><th class="stick1" style="width:96px">学生</th><th style="width:76px">类型</th><th style="width:104px">开始</th><th style="width:104px">结束</th><th class="num" style="width:64px">天数</th><th>事由 / 谁请的</th><th style="width:118px">操作</th></tr></thead><tbody>'+
      list.map(function(x){
        var s=findStu(x.sid);
        return '<tr><td class="stick1"><b class="linkish" onclick="openStu(\''+x.sid+'\')">'+h(s?sname(s):'（已删除）')+'</b></td>'+
        '<td><span class="tag '+(x.type==='病假'?'red':'blue')+'">'+h(x.type)+'</span></td>'+
        '<td>'+fmtD(x.s)+'</td><td>'+fmtD(x.e||x.s)+'</td><td class="num">'+(diffD(x.s,x.e||x.s)+1)+'</td>'+
        '<td>'+h(x.note||'')+(x.by?'<span class="mini">（'+h(x.by)+'）</span>':'')+'</td>'+
        '<td><button class="btn sm" onclick="editLeave(\''+x.id+'\')">改</button> <button class="btn sm danger" onclick="delLeave(\''+x.id+'\')">删</button></td></tr>'}).join('')+
      '</tbody></table></div>':'<div class="empty">还没有请假记录</div>')+
  '</div>';
}
function editLeave(id){
  var c=curClass(),x=id?DB.leaves.filter(function(y){return y.id===id})[0]:null,ss=studs(c);
  formModal(x?'修改请假':'登记请假',[
    {k:'sid',label:'学生',type:'select',opts:ss.map(function(s){return {v:s.id,t:s.no+' '+sname(s)}}),val:x?x.sid:(ss[0]||{}).id},
    {k:'type',label:'类型',type:'select',opts:['病假','事假','其他'],val:x?x.type:'病假'},
    {k:'s',label:'开始日期',type:'date',val:x?x.s:attDate()},
    {k:'e',label:'结束日期',type:'date',val:x?(x.e||x.s):attDate()},
    {k:'by',label:'谁来请的',val:x?x.by:'家长',ph:'妈妈 / 爸爸 / 本人'},
    {k:'note',label:'事由',val:x?x.note:'',full:true,ph:'发烧38.5，已就诊'},
    {k:'fill',label:'',type:'check',ph:'自动把这几天考勤标成请假（推荐勾上）',val:true}
  ],function(v){
    if(!v.sid)return false;
    if(v.e&&v.e<v.s){toast('结束日期不能早于开始日期');return false}
    pushUndo('请假登记');
    if(x){x.sid=v.sid;x.type=v.type;x.s=v.s;x.e=v.e;x.by=v.by;x.note=v.note}
    else DB.leaves.push({id:uid(),classId:c.id,sid:v.sid,type:v.type,s:v.s,e:v.e,by:v.by,note:v.note});
    if(v.fill){var n=applyLeave(c.id,v.sid,v.s,v.e||v.s);toast('已自动标记 '+n+' 天请假','ok')}
    save();render();
  },{note:'结束日期和开始日期写同一天，就是只请一天。'});
}
function applyLeave(cid,sid,s,e){
  var d=s,n=0,guard=0;
  while(d<=e&&guard++<200){
    if(dow(d)<=5&&!holidayOf(d)){var rec=attRecord(cid,d,true);rec[sid]='v';n++}
    d=addD(d,1);
  }
  return n;
}
function delLeave(id){
  var x=DB.leaves.filter(function(y){return y.id===id})[0];if(!x)return;
  ask('删掉这条请假记录？<br><span class="mini">已经标好的考勤不会跟着改，需要的话到点名页手动点回来。</span>',function(){
    pushUndo('删除请假');trashPut('请假记录',snameById(x.sid)+' '+x.s,x);
    DB.leaves=DB.leaves.filter(function(y){return y.id!==id});save();render();toast('已删除，可在回收站找回','ok');
  },{danger:true});
}
function exportLeave(){
  var c=curClass();
  var rows=[['学生','类型','开始','结束','天数','谁请的','事由']];
  DB.leaves.filter(function(x){return x.classId===c.id}).forEach(function(x){
    rows.push([snameById(x.sid),x.type,x.s,x.e||x.s,diffD(x.s,x.e||x.s)+1,x.by||'',x.note||'']);
  });
  dlCSV(c.name+'_请假记录.csv',rows);toast('已导出','ok');
}

/* ---------- 月度明细 ---------- */
function attMonth(){
  var c=curClass(),ym=UI.sel.attYM||today().slice(0,7),ss=studs(c);
  var days=monthDays(ym);
  var head='<tr><th class="stick1" style="width:90px">姓名</th>'+days.map(function(d){
    var wd=dow(d),hol=holidayOf(d);
    var label=hol?(hol.name.length>2?hol.name.slice(0,2):hol.name):(wd>5?'休':WD[wd].slice(1));
    var title=fmtDW(d)+(hol?' · '+hol.name:'');
    return '<th class="gridcell" title="'+h(title)+'"'+(wd>5||hol?' style="color:var(--tx3);background:var(--panel2)"':'')+'>'+(+d.slice(8))+'<br><span class="mini">'+label+'</span></th>'}).join('')+
    '<th class="num" style="width:56px">缺</th><th class="num" style="width:56px">迟</th><th class="num" style="width:56px">假</th><th class="num" style="width:76px">出勤率</th></tr>';
  var body=ss.map(function(s){
    var a=0,l=0,v=0;
    var tds=days.map(function(d){
      var wd=dow(d),hol=holidayOf(d),st=attState(c.id,d,s.id),rec=attOf(c.id,d);
      if(st==='a')a++;if(st==='l')l++;if(st==='v')v++;
      // 周末/节假日也可以登记（补课），始终可点击
      if(!rec){
        var tip=(hol?hol.name:(wd>5?'周末':'还没点名'));
        return '<td class="gridcell" style="color:var(--tx3);cursor:pointer'+(wd>5||hol?';background:var(--panel2)':'')+'" onclick="monthCycle(\''+d+'\',\''+s.id+'\')" title="'+tip+' · 点一下标记">—</td>';
      }
      var mk=st==='p'?'<span style="color:var(--green)">√</span>':st==='a'?'<span style="color:var(--red)">缺</span>':st==='l'?'<span style="color:var(--orange)">迟</span>':'<span style="color:var(--pri)">假</span>';
      return '<td class="gridcell" style="cursor:pointer'+(wd>5||hol?';background:var(--panel2)':'')+'" onclick="monthCycle(\''+d+'\',\''+s.id+'\')" title="'+fmtD(d)+' '+sname(s)+'（点一下切换）'+(wd>5||hol?' · '+(hol?hol.name:'周末补课'):'')+'">'+mk+'</td>';
    }).join('');
    // 出勤率：只要有考勤记录就计入（包括周末补课日）
    var base=days.filter(function(d){return attOf(c.id,d)}).length;
    return '<tr><td class="stick1"><b class="linkish" onclick="openStu(\''+s.id+'\')">'+h(sname(s))+'</b></td>'+tds+
      '<td class="num"'+(a?' style="color:var(--red)"':'')+'>'+(a||'')+'</td><td class="num"'+(l?' style="color:var(--orange)"':'')+'>'+(l||'')+'</td>'+
      '<td class="num"'+(v?' style="color:var(--pri)"':'')+'>'+(v||'')+'</td><td class="num">'+(base?pct(base-(a+l*0.5+v*0.5),base)+'%':'—')+'</td></tr>';
  }).join('');
  return '<div class="card"><h3>'+icon('grid',18)+'月度明细 · '+h(c.name)+'<span class="grow"></span>'+
    '<input type="month" value="'+ym+'" onchange="UI.sel.attYM=this.value;render()" style="max-width:150px">'+
    '<button class="btn sm" onclick="exportAttMonth()">'+icon('down',15)+'导出 Excel(CSV)</button>'+
    '<button class="btn sm" onclick="printAttMonth()">'+icon('print',15)+'打印</button></h3>'+
    '<div class="mini" style="margin-bottom:8px">√ 出勤　缺 缺勤　迟 迟到　假 请假　— 还没点名（点一下直接标记）。灰色列是周末/放假，也可以点名（补课）。</div>'+
    '<div class="tbwrap" style="max-height:62vh"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div>';
}
function monthDays(ym){
  var a=ym.split('-'),y=+a[0],m=+a[1],n=new Date(y,m,0).getDate(),o=[];
  for(var i=1;i<=n;i++)o.push(y+'-'+pad(m)+'-'+pad(i));
  return o;
}
function monthCycle(d,sid){
  var c=curClass(),cur=attState(c.id,d,sid),nx=ATTSEQ[(ATTSEQ.indexOf(cur)+1)%4];
  var rec=attRecord(c.id,d,true);
  if(nx==='p')delete rec[sid];else rec[sid]=nx;
  save();render();
}
function attMonthRows(){
  var c=curClass(),ym=UI.sel.attYM||today().slice(0,7),days=monthDays(ym);
  var rows=[['姓名'].concat(days.map(function(d){return (+d.slice(8))+'日'})).concat(['缺勤','迟到','请假','出勤率'])];
  studs(c).forEach(function(s){
    var a=0,l=0,v=0;
    var r=[sname(s)].concat(days.map(function(d){
      var st=attState(c.id,d,s.id);
      if(!attOf(c.id,d))return '';
      if(st==='a'){a++;return '缺'}if(st==='l'){l++;return '迟'}if(st==='v'){v++;return '假'}return '√';
    }));
    var base=days.filter(function(d){return attOf(c.id,d)}).length;
    var tot=a+l*0.5+v*0.5;
    rows.push(r.concat([a,l,v,(base?pct(base-tot,base)+'%':'')]));
  });
  return {rows:rows,ym:ym,c:c};

function attStat(){
  var c=curClass(),ss=studs(c);
  var from=UI.sel.attFrom||DB.meta.start,to=UI.sel.attTo||today();
  var days=[],d=from,guard=0;
  while(d<=to&&guard++<800){if(attOf(c.id,d))days.push(d);d=addD(d,1)}
  var rows=ss.map(function(s){
    var a=0,l=0,v=0;
    days.forEach(function(dd){var st=attState(c.id,dd,s.id);if(st==='a')a++;else if(st==='l')l++;else if(st==='v')v++});
    var tot=a+l*0.5+v*0.5;
    return {s:s,a:a,l:l,v:v,rate:days.length?pct(days.length-tot,days.length):100,cont:contDays(s.id)};
  });
  var full=rows.filter(function(x){return !x.a&&!x.l&&!x.v});
  var bad=sortBy(rows.filter(function(x){return x.a||x.l||x.v}),function(x){return x.rate});
  var risk=rows.filter(function(x){return x.cont>=2});
  return '<div class="card"><h3>'+icon('chart',18)+'考勤统计 · '+h(c.name)+'<span class="grow"></span>'+
    '<input type="date" value="'+from+'" onchange="UI.sel.attFrom=this.value;render()" style="max-width:150px">'+
    '<span class="mini">至</span><input type="date" value="'+to+'" onchange="UI.sel.attTo=this.value;render()" style="max-width:150px">'+
    '<button class="btn sm" onclick="exportAttStat()">'+icon('down',15)+'导出</button></h3>'+
    '<div class="grid g4 keep2" style="margin-bottom:12px">'+
      attKpi('已点名天数',days.length,'')+attKpi('全勤人数',full.length,'var(--green)')+
      attKpi('有缺勤的人',rows.filter(function(x){return x.a}).length,rows.filter(function(x){return x.a}).length?'var(--red)':'')+
      attKpi('班级出勤率',(days.length?pct(days.length*ss.length-sum(rows.map(function(x){return x.a+x.l*0.5+x.v*0.5})),days.length*ss.length):100)+'%','var(--pri)')+
    '</div>'+
    (risk.length?'<div class="alert red">'+icon('bell',18)+'<div class="grow"><b>要盯的人</b>：'+risk.map(function(x){return h(sname(x.s))+'（连续 '+x.cont+' 天缺勤）'}).join('、')+'</div></div>':'')+
    '<div class="grid g2">'+
      '<div><h3 style="font-size:15px">出勤最需要关注（按出勤率从低到高）</h3>'+
        (bad.length?'<div class="tbwrap"><table><thead><tr><th class="stick1">姓名</th><th class="num">缺勤</th><th class="num">迟到</th><th class="num">请假</th><th class="num">出勤率</th></tr></thead><tbody>'+
        bad.slice(0,20).map(function(x){return '<tr><td class="stick1"><span class="linkish" onclick="openStu(\''+x.s.id+'\')">'+h(sname(x.s))+'</span></td>'+
          '<td class="num"'+(x.a?' style="color:var(--red)"':'')+'>'+x.a+'</td><td class="num">'+x.l+'</td><td class="num">'+x.v+'</td>'+
          '<td class="num"'+(x.rate<90?' style="color:var(--red);font-weight:700"':'')+'>'+x.rate+'%</td></tr>'}).join('')+
        '</tbody></table></div>':'<div class="empty">这段时间大家全勤，很棒</div>')+'</div>'+
      '<div><h3 style="font-size:15px">全勤名单（'+full.length+' 人）</h3>'+
        '<div class="card" style="box-shadow:none">'+(full.length?full.map(function(x){return '<span class="tag green" style="margin:2px">'+h(sname(x.s))+'</span>'}).join(''):'<span class="mini">暂无</span>')+'</div>'+
        '<div class="row" style="margin-top:8px"><button class="btn sm" onclick="copyFull()">'+icon('copy',15)+'复制全勤名单（发家长群表扬）</button></div></div>'+
    '</div></div>';
}

function hwCount(a){
  var c=classById(a.classId);if(!c)return {n:0,s:0,g:0,tot:0};

/* ---------- 收交矩阵（优化版：横向滚动+紧凑列+状态筛选） ---------- */
function hwGrid(){
  var c=curClass(),all=hwOf(c.id),list=all.slice(0,10),ss=studs(c);
  if(!list.length)return '<div class="card"><div class="empty">还没布置作业</div></div>';
  var fSt=UI.sel.hwGridSt||''; /* ''=全部 n=未交 s=已交 g=已批 */
  var head='<tr><th class="stick1" style="width:78px">姓名</th>'+list.map(function(a,i){
    var o=hwCount(a);
    return '<th class="gridcell hw-th" title="'+h(a.title)+'">'+
      '<div class="hw-th-title">'+h(a.title)+'</div>'+
      '<div class="hw-th-meta">'+fmtD(a.due)+' · 未交'+o.n+'</div>'+
      '<button class="btn sm" style="padding:1px 5px;font-size:10px;margin-top:2px" onclick="hwSetAll(\''+a.id+'\',\'s\')">全交</button></th>'}).join('')+
    '<th class="num" style="width:48px">未交</th></tr>';
  /* 按筛选条件过滤学生：只显示在任意一列作业中符合所选状态的学生 */
  var filtSS=ss;
  if(fSt){
    filtSS=ss.filter(function(s){
      return list.some(function(a){return hwStat(a,s.id).s===fSt});
    });
  }
  var body=filtSS.map(function(s){
    var n=0;
    var tds=list.map(function(a){
      var st=hwStat(a,s.id);if(st.s==='n')n++;
      var col=st.s==='n'?'var(--red)':st.s==='s'?'var(--orange)':'var(--green)';
      var mk=st.s==='n'?'未交':st.s==='s'?'已交':('已批'+(st.g?' '+st.g:''));
      return '<td class="gridcell hw-cell" style="cursor:pointer;color:'+col+'" onclick="hwCycle(\''+a.id+'\',\''+s.id+'\')" title="'+h(a.title)+'：点一下切换">'+mk+'</td>';
    }).join('');
    return '<tr><td class="stick1"><b class="linkish" onclick="openStu(\''+s.id+'\')">'+(s.no?'<span class="mini" style="margin-right:4px">'+s.no+'</span>':'')+h(sname(s))+'</b></td>'+tds+
      '<td class="num"'+(n?' style="color:var(--red);font-weight:700"':'')+'>'+(n||'')+'</td></tr>';
  }).join('');
  /* 筛选按钮行：全部 / 未交(红) / 已交(橙) / 已批(绿)，括号内为人数 */
  var nCnt=ss.filter(function(s){return list.some(function(a){return hwStat(a,s.id).s==='n'})}).length;
  var sCnt=ss.filter(function(s){return list.some(function(a){return hwStat(a,s.id).s==='s'})}).length;
  var gCnt=ss.filter(function(s){return list.some(function(a){return hwStat(a,s.id).s==='g'})}).length;
  var fBtns='<div class="row tight" style="margin-bottom:8px;flex-wrap:wrap">'+
    '<span class="mini" style="line-height:30px;margin-right:6px">筛选：</span>'+
    '<button class="btn sm'+(!fSt?' on':'')+'" onclick="UI.sel.hwGridSt=\'\';render()">全部('+ss.length+')</button>'+
    '<button class="btn sm'+(fSt==='n'?' danger':'')+'" onclick="UI.sel.hwGridSt=\'n\';render()">'+icon('x',12)+' 未交('+nCnt+')</button>'+
    '<button class="btn sm'+(fSt==='s'?' on':'')+'" onclick="UI.sel.hwGridSt=\'s\';render()">'+icon('check',12)+' 已交('+sCnt+')</button>'+
    '<button class="btn sm'+(fSt==='g'?' on':'')+'" onclick="UI.sel.hwGridSt=\'g\';render()">'+icon('award',12)+' 已批('+gCnt+')</button>'+
    '</div>';
  return '<div class="card"><h3>'+icon('grid',18)+'收交登记 · '+h(c.name)+'<span class="grow"></span>'+
    '<button class="btn sm" onclick="exportHWGrid()">'+icon('down',15)+'导出 Excel(CSV)</button>'+
    '<button class="btn sm" onclick="printHWGrid()">'+icon('print',15)+'打印</button></h3>'+
    '<div class="alert blue">'+icon('hand',18)+'<div class="grow">收作业时点表头的<b>「全交」</b>先全部记成已交，再把没交的那几个点回「未交」——两三下就完事。<br>格子点一下循环：未交 → 已交 → 已批。改完自动存。</div></div>'+
    fBtns+
    '<div class="hw-scroll-wrap"><div class="tbwrap" style="max-height:64vh"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div>'+
    (filtSS.length!==ss.length?'<div class="mini" style="color:var(--orange);margin-top:4px">当前筛选：'+(fSt==='n'?'未交':fSt==='s'?'已交':'已批')+'，共 '+filtSS.length+' 人（全班 '+ss.length+' 人）</div>':'')+
    '<div class="row" style="margin-top:8px">'+list.map(function(a){var o=hwCount(a);
      return '<button class="btn sm'+(o.n?' danger':'')+'" onclick="copyUnsub(\''+a.id+'\')">'+icon('copy',14)+'复制「'+h(a.title.length>6?a.title.slice(0,6)+'…':a.title)+'」未交('+o.n+')</button>'}).join('')+'</div>'+
  '</div>';
}
function hwCycle(hid,sid){
  var a=hwById(hid);if(!a)return;
  if(!a.st)a.st={};
  var cur=hwStat(a,sid).s,nx=HWSEQ[(HWSEQ.indexOf(cur)+1)%3];
  var old=a.st[sid]||{};
  a.st[sid]={s:nx,g:old.g||'',c:old.c||''};
  save();render();
}
function hwSetAll(hid,st){
  var a=hwById(hid),c=classById(a.classId);
  pushUndo('作业收交：全体'+HWS[st].t);
  if(!a.st)a.st={};
  studs(c).forEach(function(s){var old=a.st[s.id]||{};a.st[s.id]={s:st,g:old.g||'',c:old.c||''}});
  save();render();toast('已全部记成'+HWS[st].t+'，现在把没交的点回「未交」','ok');
}
function hwGridRows(){
  var c=curClass(),list=hwOf(c.id).slice(0,8);
  var rows=[['姓名'].concat(list.map(function(a){return a.title})).concat(['未交次数'])];
  studs(c).forEach(function(s){
    var n=0;
    var r=[(s.no?s.no+' ':'')+sname(s)].concat(list.map(function(a){var st=hwStat(a,s.id);if(st.s==='n')n++;return st.s==='n'?'未交':st.s==='s'?'已交':('已批'+(st.g?' '+st.g:''))}));
    rows.push(r.concat([n]));
  });
  return {rows:rows,c:c};
}
function exportHWGrid(){var o=hwGridRows();dlCSV(o.c.name+'_作业收交.csv',o.rows);toast('已导出','ok')}
function printHWGrid(){var o=hwGridRows();printHTML(o.c.name+' 作业收交表',tableHTML(o.rows[0],o.rows.slice(1)))}

/* ========================= 成绩 ========================= */
function examsOf(cid){return sortBy(DB.exams.filter(function(e){return e.classId===cid}),function(e){return e.date},true)}
function examById(id){return DB.exams.filter(function(e){return e.id===id})[0]||null}
function passLine(e){return nb(e.full,100)*nb(DB.meta.pass,0.6)}
function goodLine(e){return nb(e.full,100)*nb(DB.meta.good,0.85)}
function scoreCol(e,v){
  if(v==null||v==='')return '';
  return nb(v)<passLine(e)?'var(--red)':(nb(v)>=goodLine(e)?'var(--green)':'');
}
function examStat(e){
  var c=classById(e.classId);if(!c)return null;
  var ss=studs(c),got=[],miss=0;
  ss.forEach(function(s){var v=e.scores?e.scores[s.id]:null;if(v==null||v==='')miss++;else got.push(nb(v))});
  var pl=passLine(e),gl=goodLine(e);
  return {n:ss.length,cnt:got.length,miss:miss,avg:got.length?r1(avg(got)):0,
    max:got.length?Math.max.apply(null,got):0,min:got.length?Math.min.apply(null,got):0,
    pass:pct(got.filter(function(v){return v>=pl}).length,got.length),
    good:pct(got.filter(function(v){return v>=gl}).length,got.length),
    fail:got.filter(function(v){return v<pl}).length,got:got};
}
function bands(e){
  var f=nb(e.full,100),st=examStat(e),o=[];
  var defs=[[0,.6,'不及格'],[.6,.7,'及格'],[.7,.8,'中等'],[.8,.9,'良好'],[.9,1.001,'优秀']];
  defs.forEach(function(d){
    var lo=f*d[0],hi=f*d[1];
    o.push({t:d[2],r:Math.round(lo)+'-'+(d[1]>1?f:Math.round(hi)-1),n:st.got.filter(function(v){return v>=lo&&v<hi}).length});
  });
  return o;
}
function normScore(e,sid){var v=e.scores?e.scores[sid]:null;return (v==null||v==='')?null:nb(v)/nb(e.full,100)*100}
/* 还没录分数的学生名单 */
function missList(e){

  return studs(c).filter(function(s){var v=e.scores?e.scores[s.id]:null;return v==null||v===''});
}

function editExam(id){
  var c=curClass(),e=id?examById(id):null;
  formModal(e?'修改考试':'新建考试',[
    {k:'name',label:'考试名称',val:e?e.name:'',full:true,ph:'第二单元测试'},
    {k:'date',label:'考试日期',type:'date',val:e?e.date:today()},
    {k:'full',label:'满分',type:'number',val:e?nb(e.full,100):100},
    {k:'weight',label:'权重',type:'number',step:'0.1',val:e?nb(e.weight,1):1},
    {k:'pts',label:'知识点 / 大题（用逗号分开，可写「名称:分值」）',val:e?(e.pts||[]).map(function(p){return p.name+':'+p.full}).join('，'):'',full:true,
      ph:'小数乘整数:20，小数乘小数:30，解决问题:50'}
  ],function(v){
    if(!v.name)return false;
    var pts=String(v.pts||'').split(/[，,]/).map(function(x){return x.trim()}).filter(Boolean).map(function(x){
      var a=x.split(/[:：]/);return {name:a[0].trim(),full:nb(a[1],0)}});

function rankRows(e,ss,showSS){
  var order=sortBy(ss.filter(function(s){return e.scores&&e.scores[s.id]!=null&&e.scores[s.id]!==''}),function(s){return nb(e.scores[s.id])},true);
  var rk={};order.forEach(function(s,i){rk[s.id]=i+1});
  var prev=prevExam(e);
  return (showSS||ss).map(function(s,i){
    var v=e.scores?e.scores[s.id]:'';
    var d=null;
    if(prev){var a=normScore(e,s.id),b=normScore(prev,s.id);if(a!=null&&b!=null)d=r1(a-b)}
    return '<tr><td>'+h(s.no||'')+'</td><td class="stick1"><b class="linkish" onclick="openStu(\''+s.id+'\')">'+h(sname(s))+'</b></td>'+
    '<td><input id="sc_'+i+'" data-i="'+i+'" type="number" value="'+h(v==null?'':v)+'" max="'+nb(e.full,100)+'" min="0" '+
      'style="text-align:center;font-weight:700;color:'+(scoreCol(e,v)||'inherit')+'" oninput="setScore(\''+e.id+'\',\''+s.id+'\',this.value,this)" onkeydown="scoreKey(event,'+i+')"></td>'+
    ((e.pts||[]).length?(e.pts||[]).map(function(p,pi){
      var pv=(e.pt&&e.pt[s.id])?e.pt[s.id][pi]:'';
      return '<td><input type="number" value="'+h(pv==null?'':pv)+'" max="'+nb(p.full)+'" min="0" style="text-align:center" oninput="setPt(\''+e.id+'\',\''+s.id+'\','+pi+',this.value)"></td>'}).join(''):'')+
    '<td class="num">'+(rk[s.id]||'—')+'</td>'+
    '<td class="num"'+(d==null?'':' style="color:'+(d>0?'var(--red)':d<0?'var(--green)':'var(--tx3)')+'"')+'>'+(d==null?'—':(d>0?'↑'+d:d<0?'↓'+Math.abs(d):'0'))+'</td></tr>';

function prevExam(e){

function doPasteScores(id){
  var e=examById(id),c=classById(e.classId),ss=studs(c);
  var rows=parseTable($('#psb').value);
  if(!rows.length){toast('没有内容');return}
  pushUndo('导入分数');
  if(!e.scores)e.scores={};
  var okn=0,bad=[];
  var byName={};ss.forEach(function(s){byName[s.name]=s});
  var oneCol=rows.every(function(r){return r.length===1});
  if(oneCol){
    rows.forEach(function(r,i){var s=ss[i];if(!s)return;var v=nb(r[0],null);if(v==null)return;e.scores[s.id]=Math.min(nb(e.full,100),Math.max(0,v));okn++});
  }else{
    rows.forEach(function(r){
      var nm=null,v=null;
      r.forEach(function(cell){var x=nb(cell,null);if(x!==null&&/^[\d.]+$/.test(String(cell).trim()))v=x;else if(String(cell).trim())nm=String(cell).trim()});
      if(nm&&byName[nm]&&v!=null){e.scores[byName[nm].id]=Math.min(nb(e.full,100),Math.max(0,v));okn++}
      else if(nm)bad.push(nm);
    });
  }
  save();closeModal();render();
  toast('导入 '+okn+' 个分数'+(bad.length?'，没认出：'+bad.slice(0,5).join('、'):''),'ok');
}

function lineChart(list,sid){
  if(!list.length)return '<div class="empty">没有数据</div>';
  var W=680,H=220,pl=38,pr=14,pt=14,pb=34;
  var iw=W-pl-pr,ih=H-pt-pb;
  function X(i){return pl+(list.length===1?iw/2:i*iw/(list.length-1))}
  function Y(v){return pt+ih-(v/100)*ih}
  var mine=[],cls=[];
  list.forEach(function(e,i){
    var v=normScore(e,sid);
    var all=[];studs(classById(e.classId)).forEach(function(s){var x=normScore(e,s.id);if(x!=null)all.push(x)});
    mine.push(v==null?null:{x:X(i),y:Y(v),v:r1(v)});
    cls.push(all.length?{x:X(i),y:Y(avg(all)),v:r1(avg(all))}:null);
  });
  function path(a){
    var d='',open=false;
    a.forEach(function(p){if(!p){open=false;return}d+=(open?'L':'M')+p.x+' '+p.y+' ';open=true});
    return d;
  }
  var grid='';
  [0,60,80,100].forEach(function(v){

function copyUp(lastId,prevId){
  var last=examById(lastId),prev=examById(prevId),c=classById(last.classId),o=[];
  studs(c).forEach(function(s){var a=normScore(last,s.id),b=normScore(prev,s.id);if(a!=null&&b!=null&&a>b)o.push({s:s,d:r1(a-b)})});
  o=sortBy(o,function(x){return x.d},true);
  copyText('本次《'+last.name+'》进步表扬（和上次比）：\n'+o.slice(0,15).map(function(x){return sname(x.s)+' 进步'+x.d+'分'}).join('\n'),'进步名单已复制，可以发家长群');

/* ---------- 知识点掌握 ---------- */
function kpRates(e){
  var c=classById(e.classId),ss=studs(c);
  return (e.pts||[]).map(function(p,i){
    var got=[];
    ss.forEach(function(s){var a=e.pt&&e.pt[s.id];if(a&&a[i]!=null&&a[i]!=='')got.push(nb(a[i]))});
    return {name:p.name,full:nb(p.full),rate:got.length&&nb(p.full)?pct(avg(got),nb(p.full)):0,n:got.length};
  });
}
